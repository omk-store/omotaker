<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English — Omo Taker feat. Everyday Vibe</title>

<meta name="description"
content="Listen to English by Omo Taker featuring Everyday Vibe.">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-HX57BRN5ET"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
  dataLayer.push(arguments);
}

gtag("js", new Date());
gtag("config", "G-HX57BRN5ET");
</script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background:#050505;
  color:#fff;
  padding:22px 16px 40px;
}

.page{
  width:100%;
  max-width:430px;
  margin:auto;
}

/* COVER */

.cover{
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:24px;
  overflow:hidden;
  text-align:center;
  background:
    radial-gradient(circle at top left,#9e3100,transparent 45%),
    linear-gradient(145deg,#180700,#050505);
}

.cover-content{
  padding:25px;
}

.cover-title{
  font-size:54px;
  line-height:1;
  font-weight:950;
  letter-spacing:-3px;
}

.cover-artist{
  margin-top:14px;
  color:#ddd;
  font-size:14px;
  font-weight:700;
}

/* SONG DETAILS */

.song-info{
  padding:24px 5px 18px;
  text-align:center;
}

.song-title{
  font-size:36px;
  font-weight:950;
  letter-spacing:-1px;
}

.artist{
  margin-top:8px;
  color:#aaa;
  font-size:15px;
  font-weight:700;
}

/* STREAMING BUTTONS */

.platforms{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.platform-btn{
  width:100%;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border:1px solid #272727;
  border-radius:16px;
  background:#111;
  color:#fff;
  text-decoration:none;
  transition:.15s ease;
}

.platform-btn:active{
  transform:scale(.97);
}

.platform-name{
  font-size:17px;
  font-weight:900;
}

.play{
  min-width:70px;
  padding:10px 16px;
  border-radius:999px;
  background:#fff;
  color:#000;
  text-align:center;
  font-size:12px;
  font-weight:950;
  letter-spacing:1px;
}

/* PLATFORM ACCENTS */

.spotify{
  border-color:#1db954;
}

.spotify .platform-name{
  color:#1ed760;
}

.apple{
  border-color:#d8d8d8;
}

.apple .platform-name{
  color:#fff;
}

.audiomack{
  border-color:#ff7a00;
}

.audiomack .platform-name{
  color:#ff8a00;
}

/* FOOTER */

.footer{
  margin-top:28px;
  text-align:center;
  color:#555;
  font-size:10px;
  letter-spacing:1px;
}
</style>
</head>

<body>

<main class="page">

  <section class="cover">

    <div class="cover-content">

      <div class="cover-title">
        ENGLISH
      </div>

      <div class="cover-artist">
        Omo Taker feat. Everyday Vibe
      </div>

    </div>

  </section>

  <section class="song-info">

    <h1 class="song-title">
      English
    </h1>

    <p class="artist">
      Omo Taker feat. Everyday Vibe
    </p>

  </section>

  <section class="platforms">

    <a
      href="https://open.spotify.com/album/3S5hKnoQOsy6KhsldVDscK"
      target="_blank"
      rel="noopener noreferrer"
      class="platform-btn spotify"
      onclick="trackClick('spotify');"
    >
      <span class="platform-name">Spotify</span>
      <span class="play">PLAY</span>
    </a>

    <a
      href="https://music.apple.com/us/album/english-feat-everyday-vibe-single/6787016827"
      target="_blank"
      rel="noopener noreferrer"
      class="platform-btn apple"
      onclick="trackClick('apple_music');"
    >
      <span class="platform-name">Apple Music</span>
      <span class="play">PLAY</span>
    </a>

    <a
      href="https://audiomack.com/iam_omotaker"
      target="_blank"
      rel="noopener noreferrer"
      class="platform-btn audiomack"
      onclick="trackClick('audiomack');"
    >
      <span class="platform-name">Audiomack</span>
      <span class="play">PLAY</span>
    </a>

  </section>

  <footer class="footer">
    OMK RECORD © 2026
  </footer>

</main>

<script>
function trackClick(platform){

  if(typeof gtag === "function"){

    gtag("event","platform_click",{
      event_category:"English streaming page",
      event_label:platform,
      song_name:"English",
      artist_name:"Omo Taker feat. Everyday Vibe"
    });

  }

}
</script>

</body>
</html>
