<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Work Hard — Omo Taker</title>

<meta name="description"
content="Stream Work Hard by Omo Taker. Out now on Spotify, Apple Music, Audiomack, Boomplay, Deezer and YouTube Music.">

<meta name="theme-color" content="#06132d">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#030509;
  color:#fff;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{
  -webkit-tap-highlight-color:transparent;
}

.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:18px;
}

.release-page{

  position:relative;

  width:min(100%,720px);

  min-height:calc(100vh - 36px);

  overflow:hidden;

  border-radius:34px;

  border:1px solid rgba(255,255,255,.13);

  background:
    radial-gradient(
      circle at 50% 12%,
      rgba(0,93,255,.22),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #0b1730 0%,
      #060a12 45%,
      #030509 100%
    );

  box-shadow:
    0 35px 100px rgba(0,0,0,.65);

  padding:26px 24px 30px;

}

.release-page::before{

  content:"";

  position:absolute;

  width:500px;
  height:500px;

  top:-250px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(0,101,255,.16);

  filter:blur(90px);

  pointer-events:none;

}

.release-page::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      120deg,
      transparent 30%,
      rgba(255,255,255,.018) 50%,
      transparent 70%
    );

  pointer-events:none;

}


/* HEADER */

.header{

  position:relative;

  z-index:2;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:28px;

}

.logo{

  font-size:21px;

  font-weight:950;

  letter-spacing:-1.4px;

}

.logo span{

  color:#ff5b18;

}

.omk{

  padding:9px 15px;

  border-radius:999px;

  border:1px solid rgba(255,255,255,.14);

  background:rgba(255,255,255,.045);

  color:#cbd4e5;

  font-size:10px;

  font-weight:850;

  letter-spacing:2.3px;

}


/* COVER */

.cover-wrap{

  position:relative;

  z-index:2;

  width:100%;

  display:flex;

  justify-content:center;

}

.cover{

  position:relative;

  width:min(88vw,470px);

  aspect-ratio:1;

  overflow:hidden;

  border-radius:25px;

  background:#111;

  box-shadow:

    0 35px 80px rgba(0,0,0,.6),

    0 0 70px rgba(0,82,255,.18);

}

.cover img{

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

}


/* INFO */

.info{

  position:relative;

  z-index:2;

  text-align:center;

  padding-top:29px;

}

.kicker{

  color:#72a9ff;

  font-size:10px;

  font-weight:950;

  letter-spacing:4px;

  margin-bottom:11px;

}

.title{

  font-size:clamp(43px,10vw,70px);

  line-height:.9;

  letter-spacing:-4px;

  font-weight:950;

}

.artist{

  margin-top:10px;

  color:#aeb6c5;

  font-size:15px;

}


/* MAIN CTA */

.main-button{

  position:relative;

  z-index:2;

  width:100%;

  max-width:580px;

  min-height:61px;

  margin:27px auto 0;

  border-radius:17px;

  background:#fff;

  color:#05070b;

  text-decoration:none;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  font-size:15px;

  font-weight:950;

  letter-spacing:.2px;

  box-shadow:

    0 15px 40px rgba(255,255,255,.08);

  transition:

    transform .2s ease,

    background .2s ease,

    box-shadow .2s ease;

}

.main-button:hover{

  transform:translateY(-3px);

  background:#eaf0fa;

  box-shadow:

    0 18px 48px rgba(255,255,255,.14);

}


/* PLATFORMS */

.platform-section{

  position:relative;

  z-index:2;

  width:100%;

  max-width:580px;

  margin:22px auto 0;

}

.platform-label{

  text-align:center;

  color:#687286;

  font-size:9px;

  font-weight:900;

  letter-spacing:2.5px;

  margin-bottom:10px;

}

.platforms{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;

}

.platform{

  min-height:54px;

  padding:0 12px;

  border-radius:15px;

  border:1px solid rgba(255,255,255,.105);

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  color:#e8ebf1;

  text-decoration:none;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  font-size:12px;

  font-weight:850;

  transition:

    transform .2s ease,

    background .2s ease,

    border-color .2s ease;

}

.platform:hover{

  transform:translateY(-2px);

  background:rgba(255,255,255,.11);

  border-color:rgba(255,255,255,.2);

}


/* SMALL DETAILS */

.release-details{

  position:relative;

  z-index:2;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-wrap:wrap;

  gap:8px;

  margin-top:21px;

}

.detail{

  color:#788296;

  font-size:10px;

  font-weight:750;

}

.dot{

  width:3px;

  height:3px;

  border-radius:50%;

  background:#526077;

}


/* FOOTER */

.footer{

  position:relative;

  z-index:2;

  text-align:center;

  margin-top:34px;

  color:#555f71;

  font-size:8px;

  font-weight:850;

  letter-spacing:1.8px;

}


/* MOBILE */

@media(max-width:520px){

  .page{

    padding:8px;

  }

  .release-page{

    min-height:calc(100vh - 16px);

    border-radius:29px;

    padding:20px 14px 25px;

  }

  .header{

    margin-bottom:24px;

  }

  .logo{

    font-size:19px;

  }

  .omk{

    padding:8px 11px;

    font-size:9px;

    letter-spacing:1.7px;

  }

  .cover{

    width:min(88vw,390px);

    border-radius:22px;

  }

  .title{

    letter-spacing:-3px;

  }

  .artist{

    font-size:14px;

  }

  .main-button{

    min-height:58px;

    border-radius:16px;

  }

  .platform{

    min-height:51px;

    border-radius:14px;

    font-size:11px;

  }

}

@media(max-width:350px){

  .platforms{

    grid-template-columns:1fr;

  }

}

</style>
</head>
