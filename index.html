<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Follow Follow — Omo Taker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.94)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(22px);
transform:scale(1.15);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:22px 16px 60px;
}

/* COVER */

.cover{
width:100%;
border-radius:30px;
display:block;
box-shadow:0 15px 50px rgba(0,0,0,.5);
}

/* INFO */

.info{
background:#111;
padding:30px 22px;
text-align:center;
border-radius:0 0 30px 30px;
margin-top:-5px;
margin-bottom:26px;
border:1px solid rgba(255,255,255,.05);
}

.omk{
font-size:13px;
font-weight:800;
letter-spacing:4px;
color:#ff6200;
margin-bottom:18px;
text-transform:uppercase;
}

.song{
font-size:42px;
font-weight:900;
line-height:1;
margin-bottom:10px;
}

.artist{
font-size:18px;
color:#bdbdbd;
margin-bottom:22px;
}

.caption{
font-size:15px;
color:#c8c8c8;
line-height:1.8;
}

/* SPOTIFY BOX */

.spotify-box{
width:100%;
background:#fff;
border-radius:30px;
overflow:hidden;
box-shadow:0 15px 50px rgba(0,0,0,.35);
padding:20px;
}

/* SPOTIFY BUTTON */

.spotify-btn{
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
background:#1ed760;
padding:24px 20px;
border-radius:24px;
transition:.25s ease;
}

.spotify-btn:hover{
transform:scale(.985);
}

.spotify-left{
display:flex;
align-items:center;
gap:16px;
}

.spotify-left img{
width:48px;
height:48px;
object-fit:contain;
}

.spotify-left span{
font-size:24px;
font-weight:900;
color:#fff;
}

.play-btn{
background:#fff;
color:#111;
padding:14px 26px;
border-radius:18px;
font-size:18px;
font-weight:900;
}

/* ACTIONS */

.actions{
margin-top:22px;
display:flex;
flex-direction:column;
gap:14px;
}

.action{
background:#111;
border:1px solid rgba(255,255,255,.08);
padding:18px;
border-radius:20px;
font-size:15px;
line-height:1.6;
color:#d4d4d4;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:30px;
font-size:13px;
color:#9f9f9f;
}

</style>
</head>

<body>

<div class="container">

<!-- COVER -->

<img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png"
class="cover">

<!-- INFO -->

<div class="info">

<div class="omk">
OMK RECORDS
</div>

<div class="song">
FOLLOW FOLLOW
</div>

<div class="artist">
Omo Taker 🐺
</div>

<div class="caption">
Press play ▶️<br>
Save the song ➕<br>
Share with friends 📤<br>
Run up FOLLOW FOLLOW 🔥
</div>

</div>

<!-- SPOTIFY -->

<div class="spotify-box">

<a href="https://open.spotify.com/album/4wQrUmEzJO2ex7AszfSq0e?si=tYcZUNZwQZ2Ip_AbRZ3U4Q"
target="_blank"
class="spotify-btn">

<div class="spotify-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
<span>Spotify</span>
</div>

<div class="play-btn">
PLAY
</div>

</a>

<div class="actions">

<div class="action">
▶️ Press play and feel the energy.
</div>

<div class="action">
➕ Save FOLLOW FOLLOW to your Spotify library.
</div>

<div class="action">
📤 Share with your people and post your videos using the official sound.
</div>

</div>

</div>

<!-- FOOTER -->

<div class="footer">
OMK RECORDS © 2026
</div>

</div>

</body>
</html>
