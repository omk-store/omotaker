*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* 🔥 BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.94)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');

background-position:center;
filter:blur(24px);
transform:scale(1.15);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:22px 16px 60px;
}

/* 🔥 TRENDING */

.trending{
text-align:center;
font-size:15px;
font-weight:900;
letter-spacing:2px;
color:#ff6a00;
margin-bottom:16px;
animation:flash 1.6s infinite;
}

@keyframes flash{
0%{opacity:.5;}
50%{opacity:1;}
100%{opacity:.5;}
}

/* COVER */

.cover-wrap{
background:#0d0d0d;
border-radius:34px;
overflow:hidden;
box-shadow:0 0 70px rgba(255,98,0,.25);
border:1px solid rgba(255,255,255,.04);
}

.cover{
width:100%;
display:block;
}

/* INFO */

.info{
padding:24px 20px;
text-align:center;
}

.omk{
font-size:13px;
font-weight:900;
letter-spacing:7px;
color:#ff6a00;
margin-bottom:18px;
}

.song{
font-size:58px;
font-weight:900;
line-height:0.9;
margin-bottom:16px;
}

.artist{
font-size:22px;
font-weight:800;
margin-bottom:18px;
}

.cta{
font-size:16px;
line-height:1.6;
font-weight:700;
color:#ff914d;
}

/* STREAM BOX */

.stream-box{
margin-top:26px;
display:flex;
flex-direction:column;
gap:16px;
}

/* BUTTON */

.stream-btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 20px;
border-radius:24px;
text-decoration:none;
font-weight:900;
transition:.2s ease;
backdrop-filter:blur(10px);
}

.stream-btn:active{
transform:scale(.98);
}

.left{
display:flex;
align-items:center;
gap:16px;
}

.left img{
width:38px;
height:38px;
object-fit:contain;
background:#fff;
padding:6px;
border-radius:10px;
}

.left span{
font-size:24px;
font-weight:900;
color:#fff;
}

/* RIGHT */

.open{
background:#fff;
color:#111;
padding:12px 22px;
border-radius:14px;
font-size:16px;
font-weight:900;
}

/* 🍎 APPLE */

.apple{
background:linear-gradient(135deg,#ff2d55,#a100ff);
box-shadow:0 0 40px rgba(255,0,120,.35);
}

/* 🎧 SPOTIFY */

.spotify{
background:linear-gradient(135deg,#1ed760,#0d8e3d);
box-shadow:0 0 40px rgba(30,215,96,.35);
}

/* 🎵 AUDIOMACK */

.audiomack{
background:linear-gradient(135deg,#ffb000,#ff6a00);
box-shadow:0 0 40px rgba(255,166,0,.30);
}

/* 💥 BOOMPLAY */

.boomplay{
background:linear-gradient(135deg,#00d26a,#00a94f);
box-shadow:0 0 40px rgba(0,210,106,.30);
}

/* ▶️ YOUTUBE */

.youtube{
background:linear-gradient(135deg,#ff0000,#b30000);
box-shadow:0 0 40px rgba(255,0,0,.30);
}

/* FOOTER */

.footer{
text-align:center;
margin-top:30px;
font-size:13px;
letter-spacing:1px;
color:#8c8c8c;
}

/* MOBILE */

@media(max-width:480px){

.song{
font-size:48px;
}

.left span{
font-size:20px;
}

.open{
padding:10px 18px;
font-size:14px;
}

}
