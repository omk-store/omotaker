<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#030303;
color:#fff;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.80),rgba(0,0,0,.96)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(30px);
transform:scale(1.2);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#ff660030,transparent 42%),
radial-gradient(circle at bottom,#1ed76018,transparent 40%);
z-index:-1;
}

.container{
width:92%;
max-width:520px;
margin:auto;
padding:18px 0 50px;
}

.trending{
text-align:center;
font-size:15px;
font-weight:900;
letter-spacing:2px;
color:#ff6a00;
margin-bottom:16px;
animation:flash 1.7s infinite;
}

@keyframes flash{
0%{opacity:.45;}
50%{opacity:1;}
100%{opacity:.45;}
}

.cover-box{
background:#0b0b0b;
border-radius:34px;
overflow:hidden;
border:1px solid rgba(255,255,255,.06);
box-shadow:
0 0 90px rgba(255,98,0,.18),
0 25px 80px rgba(0,0,0,.65);
}

.cover{
width:100%;
display:block;
}

.info{
padding:22px 18px 26px;
text-align:center;
background:linear-gradient(180deg,#0a0a0a,#050505);
}

.omk{
font-size:13px;
font-weight:900;
letter-spacing:8px;
color:#ff6a00;
margin-bottom:16px;
}

.cta{
font-size:17px;
line-height:1.7;
font-weight:800;
color:#ff9a61;
}

.buttons{
margin-top:24px;
display:flex;
flex-direction:column;
gap:18px;
}

.stream-btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 20px;
border-radius:28px;
text-decoration:none;
transition:.2s ease;
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(14px);
}

.stream-btn:active{
transform:scale(.98);
}

.left{
display:flex;
align-items:center;
gap:15px;
}

.icon-box{
width:54px;
height:54px;
background:#fff;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
flex-shrink:0;
font-size:30px;
font-weight:900;
color:#111;
}

.left span{
font-size:24px;
font-weight:900;
color:#fff;
}

.open{
background:#fff;
color:#111;
padding:12px 24px;
border-radius:15px;
font-size:15px;
font-weight:900;
}

.apple{
background:linear-gradient(135deg,#ff2d55,#c400ff);
box-shadow:0 0 35px rgba(255,0,120,.32);
}

.spotify{
background:linear-gradient(135deg,#1ed760,#0b8c3d);
box-shadow:0 0 35px rgba(30,215,96,.32);
}

.audiomack{
background:linear-gradient(135deg,#ffb100,#ff6600);
box-shadow:0 0 35px rgba(255,166,0,.28);
}

.boomplay{
background:linear-gradient(135deg,#00d26a,#00994d);
box-shadow:0 0 35px rgba(0,210,106,.28);
}

.youtube{
background:linear-gradient(135deg,#ff0000,#a80000);
box-shadow:0 0 35px rgba(255,0,0,.28);
}

.footer{
text-align:center;
margin-top:30px;
font-size:12px;
letter-spacing:2px;
color:#8d8d8d;
}

@media(max-width:480px){
.left span{font-size:20px;}
.open{padding:10px 18px;font-size:14px;}
.icon-box{width:48px;height:48px;font-size:27px;}
}
</style>
</head>

<body>

<div class="info">
<div class="omk">OMK RECORDS</div>
<div class="cta">Everybody is using this sound… don’t miss it 🎧🔥</div>
</div>
</div>

<div class="buttons">

<div class="open">OPEN</div>
</a>

<div class="left"><div class="icon-box">♬</div><span>Spotify</span></div>
<div class="open">OPEN</div>
</a>

<a href="YOUR_AUDIOMACK_LINK" target="_blank" class="stream-btn audiomack" onclick="gtag('event','audiomack_click');">

</a>

<div class="open">OPEN</div>
</a>

</div>

<div class="footer">OMK RECORDS © 2026</div>

</div>
