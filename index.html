<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Omo Taker - Follow Follow</title>
  <meta name="description" content="Stream Follow Follow by Omo Taker on Spotify." />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-XXXXXXXXXX");
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(30, 215, 96, 0.28), transparent 32%),
        linear-gradient(180deg, #121212, #000000);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      cursor: pointer;
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(18, 18, 18, 0.94);
      border: 1px solid rgba(30, 215, 96, 0.22);
      border-radius: 30px;
      padding: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.75);
      pointer-events: none;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 3px;
      color: #1DB954;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .cover {
      width: 100%;
      display: block;
      border-radius: 24px;
      margin-bottom: 22px;
      box-shadow:
        0 20px 55px rgba(0,0,0,0.7),
        0 0 45px rgba(30, 215, 96, 0.18);
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      margin-bottom: 8px;
      font-weight: 900;
    }

    .artist {
      color: #b3b3b3;
      font-size: 17px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .play-text {
      display: inline-block;
      background: rgba(30, 215, 96, 0.13);
      color: #1DB954;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .loader {
      margin: 10px auto 8px;
      width: 32px;
      height: 32px;
      border: 4px solid rgba(255,255,255,0.13);
      border-top: 4px solid #1DB954;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .small {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 18px;
        border-radius: 26px;
      }

      h1 {
        font-size: 30px;
      }

      .logo {
        font-size: 12px;
        margin-bottom: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">OMK · SPOTIFY RELEASE</div>

    <img
      src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png"
      alt="Follow Follow Cover Art"
      class="cover"
    />

    <h1>Follow Follow</h1>
    <p class="artist">Omo Taker</p>

    <div class="play-text">PLAYING ON SPOTIFY</div>

    <div class="loader"></div>

    <p class="small">
      Tap anywhere if Spotify does not open automatically.
    </p>
  </main>

  <script>
    const spotifyUrl = "https://open.spotify.com/track/7L4J10wzvkcuTB1zhguCMr";
    let hasOpened = false;

    function trackEvent(eventName) {
      if (typeof gtag === "function") {
        gtag("event", eventName, {
          event_category: "music",
          event_label: "Follow Follow - Omo Taker"
        });
      }
    }

    function openSpotify(eventName) {
      if (hasOpened) return;
      hasOpened = true;

      trackEvent(eventName);
      window.location.href = spotifyUrl;
    }

    document.body.addEventListener("click", function () {
      openSpotify("tap_anywhere_spotify_open");
    });

    document.body.addEventListener("touchstart", function () {
      openSpotify("tap_anywhere_spotify_open");
    }, { passive: true });

    setTimeout(function () {
      openSpotify("auto_redirect_attempt");
    }, 1800);
  </script>
</body>
</html>
