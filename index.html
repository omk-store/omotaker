<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.96)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(28px);
transform:scale(1.15);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:20px 16px 50px;
}

/* TRENDING */

.trending{
text-align:center;
font-size:15px;
font-weight:900;
letter-spacing:4px;
color:#ff6a00;
margin-bottom:14px;
animation:pulseText 2s infinite;
}

@keyframes pulseText{
0%{opacity:.5;}
50%{opacity:1;}
100%{opacity:.5;}
}

/* COVER */

.cover-wrap{
border-radius:34px;
overflow:hidden;
background:#0b0b0b;
box-shadow:
0 0 80px rgba(255,90,0,.18),
0 25px 70px rgba(0,0,0,.65);
border:1px solid rgba(255,255,255,.04);
}

.cover{
width:100%;
display:block;
}

/* INFO */

.info{
padding:24px 20px 28px;
text-align:center;
background:linear-gradient(to bottom,#090909,#050505);
}

.omk{
font-size:14px;
font-weight:900;
letter-spacing:8px;
color:#ff6a00;
margin-bottom:18px;
}

.song{
font-size:58px;
font-weight:1000;
line-height:.92;
margin-bottom:10px;
}

.artist{
font-size:20px;
font-weight:700;
color:#d7d7d7;
margin-bottom:22px;
}

.cta{
font-size:17px;
line-height:1.6;
font-weight:700;
color:#ff9a62;
}

/* BUTTONS */

.buttons{
margin-top:22px;
display:flex;
flex-direction:column;
gap:15px;
}

.stream-btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:17px 18px;
border-radius:24px;
text-decoration:none;
backdrop-filter:blur(18px);
background:rgba(18,18,18,.82);
border:1px solid rgba(255,255,255,.06);
box-shadow:
0 10px 30px rgba(0,0,0,.45),
0 0 20px rgba(255,255,255,.03);
transition:.22s ease;
overflow:hidden;
position:relative;
}

.stream-btn::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:70%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.08),
transparent
);
transform:skewX(-20deg);
transition:.7s;
}

.stream-btn:hover::before{
left:140%;
}

.stream-btn:active{
transform:scale(.98);
}

.left{
display:flex;
align-items:center;
gap:15px;
z-index:2;
}

.platform-logo{
width:46px;
height:46px;
border-radius:14px;
background:#fff;
padding:10px;
object-fit:contain;
}

.platform-name{
font-size:20px;
font-weight:900;
letter-spacing:.2px;
color:#fff;
}

.open-btn{
background:#fff;
color:#111;
padding:11px 18px;
border-radius:14px;
font-size:13px;
font-weight:1000;
letter-spacing:1px;
z-index:2;
}

/* GLOWS */

.apple{
box-shadow:
0 0 35px rgba(255,0,140,.18),
0 10px 30px rgba(0,0,0,.45);
}

.spotify{
box-shadow:
0 0 35px rgba(30,215,96,.18),
0 10px 30px rgba(0,0,0,.45);
}

.audiomack{
box-shadow:
0 0 35px rgba(255,145,0,.18),
0 10px 30px rgba(0,0,0,.45);
}

.boomplay{
box-shadow:
0 0 35px rgba(0,255,140,.16),
0 10px 30px rgba(0,0,0,.45);
}

.youtube{
box-shadow:
0 0 35px rgba(255,0,0,.16),
0 10px 30px rgba(0,0,0,.45);
}

/* FOOTER */

.footer{
text-align:center;
margin-top:34px;
font-size:13px;
letter-spacing:5px;
color:#8d8d8d;
}

/* MOBILE */

@media(max-width:480px){

.song{
font-size:46px;
}

.platform-name{
font-size:18px;
}

.open-btn{
padding:10px 15px;
}

}

</style>
