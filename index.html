<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="description"
  content="Listen to Work Hard by Omo Taker on Apple Music, Spotify, Boomplay and Audiomack."
>

<meta name="theme-color" content="#050505">

<title>Work Hard | Omo Taker</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  background: #050505;
  color: #ffffff;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeSpeed;
}

img {
  display: block;
  max-width: 100%;
}

a {
  -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   PAGE
========================================================= */

.page {
  width: min(100%, 760px);
  margin: auto;
  padding: 0 14px 28px;
}


/* =========================================================
   TOP LOGO
========================================================= */

.top-bar {
  min-height: 64px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 9px 0;
}

.logo {
  color: #ffffff;
  text-decoration: none;

  font-size: 20px;
  font-weight: 950;

  letter-spacing: -1.2px;
}

.logo span {
  color: #76aaff;
}


/* =========================================================
   MAIN CARD
========================================================= */

.music-card {
  overflow: hidden;

  border: 1px solid rgba(255,255,255,.10);
  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      #0d1119,
      #050608
    );

  box-shadow:
    0 25px 80px rgba(0,0,0,.45);
}


/* =========================================================
   COVER ART
========================================================= */

.artwork-wrapper {
  width: 100%;
  padding: 14px 14px 0;
}

.artwork {
  width: 100%;
  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 22px;

  background: #111111;
}

.artwork img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}


/* =========================================================
   SONG TITLE
========================================================= */

.song-info {
  text-align: center;

  padding:
    28px
    20px
    8px;
}

.song-title {
  color: #ffffff;

  font-size:
    clamp(42px, 9vw, 68px);

  line-height: .92;

  font-weight: 900;

  letter-spacing: -3.5px;
}

.artist-name {
  color: #a9a9a9;

  font-size: 15px;

  margin-top: 11px;
}


/* =========================================================
   PLATFORM HEADING
========================================================= */

.platform-heading {
  text-align: center;

  color: #737b8d;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 3px;

  margin:
    27px
    20px
    14px;
}


/* =========================================================
   PLATFORMS
========================================================= */

.platforms {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 10px;

  padding:
    0
    20px;
}


/* =========================================================
   PLATFORM BUTTONS
========================================================= */

.platform-button {
  min-height: 62px;

  padding: 0 18px;

  border:
    1px solid
    rgba(255,255,255,.11);

  border-radius: 17px;

  color: #ffffff;

  text-decoration: none;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  font-size: 14px;
  font-weight: 800;

  transition:
    transform .15s ease,
    background .15s ease,
    border-color .15s ease;
}

.platform-button:active {
  transform: scale(.97);
}

.platform-button:hover {
  border-color:
    rgba(255,255,255,.20);
}


/* =========================================================
   APPLE MUSIC
========================================================= */

.platform-button.apple {
  background:
    linear-gradient(
      145deg,
      #1b1b1f,
      #111114
    );
}


/* =========================================================
   SPOTIFY
========================================================= */

.platform-button.spotify {
  background:
    linear-gradient(
      145deg,
      #182119,
      #101410
    );
}


/* =========================================================
   BOOMPLAY
========================================================= */

.platform-button.boomplay {
  background:
    linear-gradient(
      145deg,
      #181d22,
      #101214
    );
}


/* =========================================================
   AUDIOMACK
========================================================= */

.platform-button.audiomack {
  background:
    linear-gradient(
      145deg,
      #201b15,
      #12110f
    );
}


/* =========================================================
   ONLY FOOTER TEXT
========================================================= */

.card-footer {
  padding:
    31px
    20px
    27px;

  text-align: center;
}

.powered {
  color: #687083;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 2px;

  text-transform: uppercase;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .page {
    padding:
      0
      10px
      22px;
  }

  .top-bar {
    min-height: 58px;
  }

  .music-card {
    border-radius: 24px;
  }

  .artwork-wrapper {
    padding:
      10px
      10px
      0;
  }

  .artwork {
    border-radius: 19px;
  }

  .song-info {
    padding:
      25px
      17px
      7px;
  }

  .song-title {
    font-size: 48px;
    letter-spacing: -2.7px;
  }

  .artist-name {
    font-size: 14px;
  }

  .platform-heading {
    margin:
      25px
      15px
      13px;
  }

  .platforms {
    padding:
      0
      14px;

    gap: 9px;
  }

  .platform-button {
    min-height: 59px;

    border-radius: 15px;

    font-size: 13px;
  }

  .card-footer {
    padding:
      28px
      15px
      24px;
  }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

  .song-title {
    font-size: 43px;
  }

  .platform-button {
    min-height: 56px;
    font-size: 12px;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

}

</style>
</head>


<body>

<main class="page">


<!-- =======================================================
     TOP
======================================================== -->

<header class="top-bar">

  <a
    class="logo"
    href="https://omotaker.com"
  >
    OMO<span>TAKER</span>
  </a>

</header>


<!-- =======================================================
     WORK HARD
======================================================== -->

<section
  class="music-card"
  aria-label="Work Hard by Omo Taker"
>


  <!-- COVER -->

  <div class="artwork-wrapper">

    <div class="artwork">

      <img
        src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/CFC9C620-39B2-4308-83EA-DA63B4B2B665.png"
        alt="Work Hard by Omo Taker cover artwork"
        width="700"
        height="700"
        fetchpriority="high"
        decoding="async"
      >

    </div>

  </div>


  <!-- SONG -->

  <div class="song-info">

    <h1 class="song-title">
      Work Hard
    </h1>

    <p class="artist-name">
      Omo Taker • Single
    </p>

  </div>


  <!-- ONE INSTRUCTION ONLY -->

  <div class="platform-heading">
    LISTEN ON YOUR FAVORITE PLATFORM
  </div>


  <!-- =====================================================
       STREAMING PLATFORMS
  ====================================================== -->

  <div class="platforms">


    <!-- APPLE MUSIC -->

    <a
      class="platform-button apple"
      href="https://music.apple.com/ng/album/work-hard-single/6808988385"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Listen to Work Hard on Apple Music"
    >
      Apple Music
    </a>


    <!-- SPOTIFY -->

    <a
      class="platform-button spotify"
      href="https://open.spotify.com/album/3Fl2WM9a0tOKUdzcbsiK2E?si=2ZxViGZmTiKfdDA8FF_1hA&utm_source=copy-link"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Listen to Work Hard on Spotify"
    >
      Spotify
    </a>


    <!-- BOOMPLAY -->

    <a
      class="platform-button boomplay"
      href="https://www.boomplay.com/share/album/EQU5SNbgs04WQgScvWRJwfI7?srModel=Linkfire&srList=eeffdc963721d692e77fb31ce3ce9caf"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Listen to Work Hard on Boomplay"
    >
      Boomplay
    </a>


    <!-- AUDIOMACK -->

    <a
      class="platform-button audiomack"
      href="https://audiomack.com/iam_omotaker/song/work-hard?share-user-id=111838460"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Listen to Work Hard on Audiomack"
    >
      Audiomack
    </a>


  </div>


  <!-- =====================================================
       ONLY TEXT BELOW PLATFORMS
  ====================================================== -->

  <footer class="card-footer">

    <div class="powered">
      POWERED BY OMK RECORD
    </div>

  </footer>


</section>


</main>

</body>
</html>
