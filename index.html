<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="description"
  content="Listen to Work Hard by Omo Taker on Apple Music, Spotify, Audiomack, Boomplay and YouTube Music."
>

<meta name="theme-color" content="#03060d">

<title>Work Hard — Omo Taker</title>

<link
  rel="preconnect"
  href="https://raw.githubusercontent.com"
  crossorigin
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(0, 74, 255, 0.18),
      transparent 34%
    ),
    radial-gradient(
      circle at 50% 55%,
      rgba(0, 42, 130, 0.10),
      transparent 40%
    ),
    #03060d;

  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;

  overflow-x: hidden;
}

/* =====================================================
   PAGE
===================================================== */

.page {
  width: 100%;
  max-width: 720px;

  margin: 0 auto;

  padding:
    14px
    12px
    35px;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar {
  height: 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  position: relative;
}

.top-logo {
  font-size: 13px;

  font-weight: 900;

  letter-spacing: 2px;

  color: #ffffff;
}

.top-logo span {
  color: #ff5b18;
}

.top-right {
  position: absolute;

  right: 4px;

  color: #626b7d;

  font-size: 8px;

  font-weight: 800;

  letter-spacing: 2px;
}

/* =====================================================
   MAIN CARD
===================================================== */

.main-card {
  width: 100%;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 27px;

  background:
    linear-gradient(
      180deg,
      #07101f 0%,
      #050912 48%,
      #03050a 100%
    );

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.48);
}

/* =====================================================
   ARTWORK
===================================================== */

.art-container {
  padding: 12px 12px 0;
}

.cover {
  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  border-radius: 21px;

  background: #07101e;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.30);

  /*
    Important:
    The artwork is the main image, so load it first.
  */

  fetchpriority: high;

  decoding: async;
}

/* =====================================================
   SONG TITLE
===================================================== */

.song-info {
  text-align: center;

  padding:
    32px
    18px
    4px;
}

.song-title {
  font-size:
    clamp(
      42px,
      10vw,
      65px
    );

  line-height: .92;

  letter-spacing: -3.5px;

  font-weight: 950;
}

.artist {
  margin-top: 10px;

  color: #aeb4c0;

  font-size: 16px;

  font-weight: 500;
}

/* =====================================================
   INSTRUCTION
===================================================== */

.listen-title {
  text-align: center;

  padding:
    27px
    15px
    14px;

  color: #8ea7d9;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 3.2px;

  text-transform: uppercase;
}

/* =====================================================
   PLATFORM LIST
===================================================== */

.platforms {
  padding:
    0
    18px
    10px;

  display: grid;

  gap: 11px;
}

/* =====================================================
   PLATFORM BUTTON
===================================================== */

.platform {
  min-height: 67px;

  width: 100%;

  display: flex;

  align-items: center;

  gap: 16px;

  padding:
    0
    18px;

  border:
    1px solid
    rgba(255,255,255,.11);

  border-radius: 18px;

  background:
    linear-gradient(
      90deg,
      #111722,
      #1a2230
    );

  color: #ffffff;

  text-decoration: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    transform .15s ease,
    background .15s ease;
}

.platform:hover {
  background:
    linear-gradient(
      90deg,
      #151d2a,
      #202b3c
    );
}

.platform:active {
  transform: scale(.985);
}

/* =====================================================
   PLATFORM ICONS
===================================================== */

.platform-icon {
  width: 43px;
  height: 43px;

  flex-shrink: 0;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}

/* Apple */

.apple-icon {
  background: #ff375f;

  color: #fff;

  font-size: 25px;

  font-weight: 500;
}

/* Spotify */

.spotify-icon {
  background: #1ed760;

  color: #050505;

  font-size: 22px;

  font-weight: 900;
}

/* Audiomack */

.audiomack-icon {
  background: #111111;

  color: #ff9d00;

  font-size: 25px;

  font-weight: 900;
}

/* Boomplay */

.boomplay-icon {
  background: #00d9e8;

  color: #061017;

  font-size: 25px;

  font-weight: 950;
}

/* YouTube */

.youtube-icon {
  background: #ff0000;

  color: #fff;

  font-size: 19px;

  font-weight: 900;
}

/* =====================================================
   PLATFORM NAME
===================================================== */

.platform-name {
  flex: 1;

  font-size: 17px;

  font-weight: 750;

  letter-spacing: -.25px;
}

/* =====================================================
   ARROW
===================================================== */

.arrow {
  color: #ffffff;

  font-size: 28px;

  line-height: 1;

  font-weight: 300;
}

/* =====================================================
   FOOTER
===================================================== */

.footer {
  padding:
    25px
    20px
    29px;

  text-align: center;
}

.footer-decoration {
  display: flex;

  align-items: center;

  justify-content: center;

  gap: 18px;

  margin-bottom: 12px;
}

.footer-decoration::before,
.footer-decoration::after {
  content: "";

  width: 72px;

  height: 1px;

  background:
    rgba(255,255,255,.18);
}

.footer-text {
  color: #697487;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 3px;

  text-transform: uppercase;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 520px) {

  .page {
    padding:
      8px
      8px
      25px;
  }

  .topbar {
    height: 48px;
  }

  .top-logo {
    font-size: 12px;
  }

  .top-right {
    display: none;
  }

  .main-card {
    border-radius: 24px;
  }

  .art-container {
    padding:
      9px
      9px
      0;
  }

  .cover {
    border-radius: 19px;
  }

  .song-info {
    padding-top: 28px;
  }

  .song-title {
    letter-spacing: -3px;
  }

  .artist {
    font-size: 15px;
  }

  .listen-title {
    padding-top: 25px;

    font-size: 9px;

    letter-spacing: 2.7px;
  }

  .platforms {
    padding:
      0
      13px
      8px;

    gap: 10px;
  }

  .platform {
    min-height: 64px;

    padding:
      0
      14px;

    border-radius: 16px;

    gap: 14px;
  }

  .platform-icon {
    width: 42px;
    height: 42px;

    border-radius: 11px;
  }

  .platform-name {
    font-size: 16px;
  }

  .arrow {
    font-size: 26px;
  }

  .footer {
    padding-bottom: 25px;
  }

}

/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 370px) {

  .song-title {
    font-size: 39px;
  }

  .platform {
    min-height: 61px;
  }

  .platform-icon {
    width: 39px;
    height: 39px;
  }

  .platform-name {
    font-size: 15px;
  }

}

/* =====================================================
   REDUCE MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  .platform {
    transition: none;
  }

}

</style>

</head>

<body>

<main class="page">

  <!-- ===============================================
       TOP
  ================================================ -->

  <header class="topbar">

    <div class="top-logo">
      OMO TAKER
    </div>

    <div class="top-right">
      OFFICIAL
    </div>

  </header>


  <!-- ===============================================
       MAIN CARD
  ================================================ -->

  <section class="main-card">


    <!-- =============================================
         WORK HARD ARTWORK
    ============================================== -->

    <div class="art-container">

      <img
        class="cover"
        src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/CFC9C620-39B2-4308-83EA-DA63B4B2B665.png"
        alt="Work Hard by Omo Taker"
        width="700"
        height="700"
        fetchpriority="high"
        decoding="async"
      >

    </div>


    <!-- =============================================
         TITLE
    ============================================== -->

    <div class="song-info">

      <h1 class="song-title">
        Work Hard
      </h1>

      <p class="artist">
        Omo Taker • Single
      </p>

    </div>


    <!-- =============================================
         ONLY INSTRUCTION
    ============================================== -->

    <div class="listen-title">
      Listen on your favorite platform
    </div>


    <!-- =============================================
         STREAMING PLATFORMS
    ============================================== -->

    <div class="platforms">


      <!-- APPLE MUSIC -->

      <a
        class="platform"
        href="https://music.apple.com/ng/album/work-hard-single/6808988385"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Apple Music"
        aria-label="Listen to Work Hard on Apple Music"
      >

        <span class="platform-icon apple-icon">
          ♪
        </span>

        <span class="platform-name">
          Apple Music
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- SPOTIFY -->

      <a
        class="platform"
        href="https://open.spotify.com/album/3Fl2WM9a0tOKUdzcbsiK2E?si=2ZxViGZmTiKfdDA8FF_1hA&utm_source=copy-link"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Spotify"
        aria-label="Listen to Work Hard on Spotify"
      >

        <span class="platform-icon spotify-icon">
          ●
        </span>

        <span class="platform-name">
          Spotify
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- AUDIOMACK -->

      <a
        class="platform"
        href="https://audiomack.com/iam_omotaker/song/work-hard?share-user-id=111838460"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Audiomack"
        aria-label="Listen to Work Hard on Audiomack"
      >

        <span class="platform-icon audiomack-icon">
          〽
        </span>

        <span class="platform-name">
          Audiomack
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- BOOMPLAY -->

      <a
        class="platform"
        href="https://www.boomplay.com/share/album/EQU5SNbgs04WQgScvWRJwfI7?srModel=Linkfire&srList=eeffdc963721d692e77fb31ce3ce9caf"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Boomplay"
        aria-label="Listen to Work Hard on Boomplay"
      >

        <span class="platform-icon boomplay-icon">
          B
        </span>

        <span class="platform-name">
          Boomplay
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- YOUTUBE MUSIC -->

      <a
        class="platform"
        href="https://music.youtube.com/playlist?list=OLAK5uy_mWzhgDqNxaGNH9PkNrwuzE_EwPAWl2R4M"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="YouTube Music"
        aria-label="Listen to Work Hard on YouTube Music"
      >

        <span class="platform-icon youtube-icon">
          ▶
        </span>

        <span class="platform-name">
          YouTube Music
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


    </div>


    <!-- =============================================
         FOOTER
    ============================================== -->

    <footer class="footer">

      <div class="footer-decoration"></div>

      <div class="footer-text">
        Powered by OMK Record
      </div>

    </footer>


  </section>

</main>


<!-- ===============================================
     LIGHTWEIGHT CLICK TRACKING
================================================ -->

<script>

document.addEventListener(
  "click",
  function(event) {

    const link =
      event.target.closest(
        "[data-platform]"
      );

    if (!link) return;

    const platform =
      link.getAttribute(
        "data-platform"
      );

    /*
      Lightweight tracking only.
      It does not hold up the redirect.
    */

    console.log(
      "Work Hard streaming click:",
      platform
    );

  },
  {
    passive: true
  }
);

</script>

</body>
</html>
