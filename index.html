<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#030303;
color:#fff;
overflow-x:hidden;
}

/* 🔥 FUTURE FM STYLE BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.80),rgba(0,0,0,.95)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(30px);
transform:scale(1.2);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#ff660020,transparent 40%),
radial-gradient(circle at bottom,#ff330010,transparent 40%);
z-index:-1;
}

/* MAIN */

.container{
width:92%;
max-width:520px;
margin:auto;
padding:18px 0 50px;
}

/* TRENDING */

.trending{
text-align:center;
font-size:15px;
font-weight:900;
letter-spacing:2px;
color:#ff6a00;
margin-bottom:16px;
animation:flash 1.7s infinite;
}

@keyframes flash{
0%{opacity:.45;}
50%{opacity:1;}
100%{opacity:.45;}
}

/* COVER */

.cover-box{
background:#0b0b0b;
border-radius:34px;
overflow:hidden;
border:1px solid rgba(255,255,255,.05);
box-shadow:
0 0 80px rgba(255,98,0,.15),
0 25px 80px rgba(0,0,0,.55);
}

.cover{
width:100%;
display:block;
}

/* INFO */

.info{
padding:24px 18px 28px;
text-align:center;
background:linear-gradient(180deg,#0a0a0a,#050505);
}

.omk{
font-size:13px;
font-weight:900;
letter-spacing:8px;
color:#ff6a00;
margin-bottom:18px;
}

.cta{
font-size:17px;
line-height:1.7;
font-weight:700;
color:#ff9a61;
}

/* BUTTONS */

.buttons{
margin-top:24px;
display:flex;
flex-direction:column;
gap:18px;
}

/* STREAM BUTTON */

.stream-btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 20px;
border-radius:28px;
text-decoration:none;
transition:.2s ease;
border:1px solid rgba(255,255,255,.06);
backdrop-filter:blur(14px);
}

.stream-btn:hover{
transform:translateY(-2px);
}

.stream-btn:active{
transform:scale(.98);
}

/* LEFT */

.left{
display:flex;
align-items:center;
gap:15px;
}

.icon-box{
width:54px;
height:54px;
background:#fff;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
flex-shrink:0;
}

.icon-box img{
width:30px;
height:30px;
object-fit:contain;
}

.left span{
font-size:24px;
font-weight:900;
color:#fff;
}

/* OPEN BUTTON */

.open{
background:#fff;
color:#111;
padding:12px 24px;
border-radius:15px;
font-size:15px;
font-weight:900;
}

/* INDIVIDUAL COLORS */

.apple{
background:linear-gradient(135deg,#ff2d55,#c400ff);
box-shadow:0 0 35px rgba(255,0,120,.28);
}

.spotify{
background:linear-gradient(135deg,#1ed760,#0b8c3d);
box-shadow:0 0 35px rgba(30,215,96,.28);
}

.audiomack{
background:linear-gradient(135deg,#ffb100,#ff6600);
box-shadow:0 0 35px rgba(255,166,0,.25);
}

.boomplay{
background:linear-gradient(135deg,#00d26a,#00994d);
box-shadow:0 0 35px rgba(0,210,106,.25);
}

.youtube{
background:linear-gradient(135deg,#ff0000,#a80000);
box-shadow:0 0 35px rgba(255,0,0,.25);
}

/* FOOTER */

.footer{
text-align:center;
margin-top:30px;
font-size:12px;
letter-spacing:2px;
color:#8d8d8d;
}

/* MOBILE */

@media(max-width:480px){

.left span{
font-size:20px;
}

.open{
padding:10px 18px;
font-size:14px;
}

.icon-box{
width:48px;
height:48px;
}

}

</style>
</head>
