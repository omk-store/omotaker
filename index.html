<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Follow Follow — Omo Taker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
cursor:pointer;
}

/* BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.94)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(22px);
transform:scale(1.15);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:22px 16px 50px;
}

/* COVER */

.cover{
width:100%;
border-radius:32px;
display:block;
box-shadow:0 15px 50px rgba(0,0,0,.55);
}

/* INFO */

.info{
background:#0e0e0e;
padding:18px;
text-align:center;
border-radius:0 0 32px 32px;
margin-top:-5px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.04);
}

.omk{
font-size:13px;
font-weight:900;
letter-spacing:5px;
color:#ff6200;
text-transform:uppercase;
}

/* SPOTIFY BOX */

.spotify-box{
width:100%;
background:#fff;
border-radius:34px;
padding:22px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

/* SPOTIFY BUTTON */

.spotify-btn{
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
background:#1ed760;
padding:24px 20px;
border-radius:26px;
transition:.2s ease;
}

.spotify-btn:active{
transform:scale(.98);
}

.spotify-left{
display:flex;
align-items:center;
gap:16px;
}

.spotify-left img{
width:50px;
height:50px;
object-fit:contain;
}

.spotify-left span{
font-size:26px;
font-weight:900;
color:#fff;
}

.play-btn{
background:#fff;
color:#111;
padding:14px 28px;
border-radius:18px;
font-size:20px;
font-weight:900;
}

/* INSTRUCTION TEXT */

.save-text{
text-align:center;
margin-top:22px;
font-size:14px;
line-height:1.7;
color:#bdbdbd;
font-weight:500;
}

.save-text .plus{
color:#1ed760;
font-size:24px;
font-weight:900;
vertical-align:middle;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:28px;
font-size:13px;
color:#9e9e9e;
letter-spacing:1px;
}

/* OPEN SPOTIFY SCREEN */

#spotifyGate{
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.95)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
z-index:999999;
backdrop-filter:blur(14px);
opacity:0;
pointer-events:none;
transition:.4s;
}

#spotifyGate.active{
opacity:1;
pointer-events:auto;
}

.gate-box{
width:90%;
max-width:380px;
text-align:center;
padding:30px 24px;
border-radius:30px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
box-shadow:0 0 60px rgba(0,0,0,.45);
animation:popup .35s ease;
}

@keyframes popup{
from{
transform:scale(.9);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.gate-cover{
width:180px;
height:180px;
object-fit:cover;
border-radius:24px;
margin-bottom:22px;
box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.gate-title{
font-size:34px;
font-weight:900;
margin-bottom:10px;
}

.gate-sub{
font-size:15px;
color:rgba(255,255,255,.7);
margin-bottom:28px;
line-height:1.6;
}

#openSpotifyBtn{
width:100%;
padding:18px;
border:none;
border-radius:20px;
font-size:18px;
font-weight:900;
background:#1DB954;
color:#fff;
cursor:pointer;
transition:.25s;
box-shadow:0 10px 30px rgba(29,185,84,.35);
}

#openSpotifyBtn:active{
transform:scale(.96);
}

.tap-text{
margin-top:16px;
font-size:13px;
color:rgba(255,255,255,.55);
}

</style>
</head>

<body>

<div class="container">

<!-- COVER -->

<img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png"
class="cover">

<!-- INFO -->

<div class="info">

<div class="omk">
OMK RECORDS
</div>

</div>

<!-- SPOTIFY -->

<div class="spotify-box">

<div class="spotify-btn" id="tapAnywhere">

<div class="spotify-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
<span>Spotify</span>
</div>

<div class="play-btn">
OPEN
</div>

</div>

</div>

<!-- SAVE TEXT -->

<div class="save-text">
Tap anywhere to preview the experience.<br>
Then tap OPEN ON SPOTIFY.
</div>

<!-- FOOTER -->

<div class="footer">
OMK RECORDS © 2026
</div>

</div>

<!-- OPEN SPOTIFY SCREEN -->

<div id="spotifyGate">

<div class="gate-box">

<img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png"
class="gate-cover">

<div class="gate-title">
FOLLOW FOLLOW
</div>

<div class="gate-sub">
Preview unlocked.<br>
Continue listening on Spotify.
</div>

<button id="openSpotifyBtn">
OPEN ON SPOTIFY
</button>

<div class="tap-text">
Powered by OMK RECORDS
</div>

</div>

</div>

<!-- AUDIO -->

<audio id="previewAudio" preload="auto">
<source src="YOUR-AUDIO.mp3" type="audio/mpeg">
</audio>

<script>

const gate = document.getElementById("spotifyGate");
const tapArea = document.getElementById("tapAnywhere");
const audio = document.getElementById("previewAudio");

let opened = false;

function showGate(){

if(opened) return;

opened = true;

gate.classList.add("active");

if(audio){
audio.play().catch(()=>{});
}

}

document.body.addEventListener("click", showGate);

document.getElementById("openSpotifyBtn")
.addEventListener("click", function(){

window.location.href =
"https://open.spotify.com/album/4wQrUmEzJO2ex7AszfSq0e?si=tYcZUNZwQZ2Ip_AbRZ3U4Q";

});

</script>

</body>
</html>
