<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="description"
  content="Listen to Work Hard by Omo Taker on Apple Music, Spotify, Audiomack, Boomplay and YouTube Music."
>

<meta name="theme-color" content="#05070d">

<title>Work Hard — Omo Taker</title>

<!-- Faster connection to image host -->
<link
  rel="preconnect"
  href="https://raw.githubusercontent.com"
  crossorigin
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(0, 75, 255, 0.16),
      transparent 42%
    ),
    #05070d;

  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;

  overflow-x: hidden;
}

a {
  -webkit-tap-highlight-color: transparent;
}

/* =========================================================
   PAGE
========================================================= */

.page {
  width: 100%;
  max-width: 720px;

  margin: 0 auto;

  padding:
    env(safe-area-inset-top)
    14px
    35px
    14px;
}

/* =========================================================
   TOP BRAND
========================================================= */

.top {
  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 12px 4px 18px;
}

.brand {
  font-size: 15px;

  font-weight: 900;

  letter-spacing: -0.5px;
}

.brand span {
  color: #ff5b18;
}

.status {
  color: #777d8b;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 2px;
}

/* =========================================================
   MAIN CARD
========================================================= */

.card {
  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,0.10);

  border-radius: 28px;

  background:
    linear-gradient(
      180deg,
      #07101f 0%,
      #05070d 55%,
      #040509 100%
    );

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.45);
}

/* =========================================================
   ARTWORK
========================================================= */

.art-wrap {
  padding: 14px 14px 0;
}

.artwork {
  display: block;

  width: 100%;

  height: auto;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  border-radius: 21px;

  background: #08101d;

  /*
    High priority because this is the most important
    visual on the page.
  */

  fetchpriority: high;

  decoding: async;
}

/* =========================================================
   SONG INFO
========================================================= */

.song-info {
  text-align: center;

  padding:
    30px
    18px
    18px;
}

.song-title {
  font-size: clamp(42px, 11vw, 66px);

  line-height: .92;

  letter-spacing: -3.5px;

  font-weight: 950;
}

.artist-name {
  margin-top: 9px;

  color: #a9afbd;

  font-size: 15px;

  font-weight: 500;
}

/* =========================================================
   SINGLE INSTRUCTION
========================================================= */

.instruction {
  margin-top: 21px;

  text-align: center;

  color: #8fa6d3;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 3px;

  text-transform: uppercase;
}

/* =========================================================
   STREAMING BUTTONS
========================================================= */

.platforms {
  padding:
    16px
    18px
    12px;

  display: grid;

  gap: 11px;
}

.platform {
  position: relative;

  min-height: 67px;

  width: 100%;

  padding: 0 20px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 18px;

  background:
    linear-gradient(
      90deg,
      #111722,
      #1a2230
    );

  color: #ffffff;

  text-decoration: none;

  display: flex;

  align-items: center;

  gap: 16px;

  transition:
    transform .15s ease,
    background .15s ease;
}

.platform:active {
  transform: scale(.985);
}

.platform:hover {
  background:
    linear-gradient(
      90deg,
      #161d29,
      #202a39
    );
}

/* =========================================================
   PLATFORM ICON
========================================================= */

.icon {
  width: 43px;
  height: 43px;

  flex-shrink: 0;

  border-radius: 12px;

  display: grid;

  place-items: center;

  font-size: 20px;

  font-weight: 900;
}

.apple {
  background: #ff3b57;
}

.spotify {
  background: #1ed760;

  color: #050505;
}

.audiomack {
  background: #111111;

  color: #ff9800;
}

.boomplay {
  background: #08d9e8;

  color: #061017;
}

.youtube {
  background: #ff0000;
}

/* =========================================================
   PLATFORM NAME
========================================================= */

.platform-name {
  flex: 1;

  font-size: 17px;

  font-weight: 750;

  letter-spacing: -.3px;
}

/* =========================================================
   ARROW
========================================================= */

.arrow {
  color: #ffffff;

  font-size: 25px;

  line-height: 1;

  opacity: .95;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
  padding:
    25px
    20px
    30px;

  text-align: center;
}

.footer-line {
  width: 70px;

  height: 1px;

  margin:
    0 auto
    13px;

  background:
    rgba(255,255,255,.18);
}

.footer-text {
  color: #697285;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 3px;

  text-transform: uppercase;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 500px) {

  .page {
    padding-left: 9px;
    padding-right: 9px;

    padding-bottom: 25px;
  }

  .top {
    padding-left: 7px;
    padding-right: 7px;
  }

  .status {
    font-size: 8px;

    letter-spacing: 1.5px;
  }

  .card {
    border-radius: 24px;
  }

  .art-wrap {
    padding: 10px 10px 0;
  }

  .artwork {
    border-radius: 18px;
  }

  .song-info {
    padding-top: 26px;
  }

  .song-title {
    letter-spacing: -3px;
  }

  .platforms {
    padding-left: 13px;
    padding-right: 13px;
  }

  .platform {
    min-height: 64px;

    padding-left: 15px;
    padding-right: 15px;

    border-radius: 16px;
  }

  .platform-name {
    font-size: 16px;
  }

  .icon {
    width: 42px;
    height: 42px;
  }

}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 360px) {

  .song-title {
    font-size: 40px;
  }

  .platform-name {
    font-size: 15px;
  }

  .platform {
    min-height: 61px;
  }

}

/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  .platform {
    transition: none;
  }

}

</style>

</head>

<body>

<main class="page">

  <!-- =====================================================
       TOP
  ====================================================== -->

  <header class="top">

    <div class="brand">
      OMO<span>TAKER</span>
    </div>

    <div class="status">
      OFFICIAL
    </div>

  </header>


  <!-- =====================================================
       MAIN STREAMING CARD
  ====================================================== -->

  <section class="card">

    <!-- ARTWORK -->

    <div class="art-wrap">

      <img
        class="artwork"
        src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/CFC9C620-39B2-4308-83EA-DA63B4B2B665.png"
        alt="Work Hard by Omo Taker cover artwork"
        width="700"
        height="700"
        fetchpriority="high"
        decoding="async"
      >

    </div>


    <!-- SONG INFORMATION -->

    <div class="song-info">

      <h1 class="song-title">
        Work Hard
      </h1>

      <p class="artist-name">
        Omo Taker • Single
      </p>

    </div>


    <!-- ONE INSTRUCTION ONLY -->

    <div class="instruction">
      Listen on your favorite platform
    </div>


    <!-- =================================================
         STREAMING PLATFORMS
    ================================================== -->

    <div class="platforms">


      <!-- APPLE MUSIC -->

      <a
        class="platform"
        href="https://music.apple.com/ng/album/work-hard-single/6808988385"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Apple Music"
        aria-label="Listen to Work Hard on Apple Music"
      >

        <span class="icon apple">
          ♪
        </span>

        <span class="platform-name">
          Apple Music
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- SPOTIFY -->

      <a
        class="platform"
        href="https://open.spotify.com/album/3Fl2WM9a0tOKUdzcbsiK2E?si=2ZxViGZmTiKfdDA8FF_1hA&utm_source=copy-link"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Spotify"
        aria-label="Listen to Work Hard on Spotify"
      >

        <span class="icon spotify">
          ●
        </span>

        <span class="platform-name">
          Spotify
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- AUDIOMACK -->

      <a
        class="platform"
        href="https://audiomack.com/iam_omotaker/song/work-hard?share-user-id=111838460"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Audiomack"
        aria-label="Listen to Work Hard on Audiomack"
      >

        <span class="icon audiomack">
          〽
        </span>

        <span class="platform-name">
          Audiomack
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- BOOMPLAY -->

      <a
        class="platform"
        href="https://www.boomplay.com/share/album/EQU5SNbgs04WQgScvWRJwfI7?srModel=Linkfire&srList=eeffdc963721d692e77fb31ce3ce9caf"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="Boomplay"
        aria-label="Listen to Work Hard on Boomplay"
      >

        <span class="icon boomplay">
          B
        </span>

        <span class="platform-name">
          Boomplay
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- YOUTUBE MUSIC -->

      <a
        class="platform"
        href="https://music.youtube.com/playlist?list=OLAK5uy_mWzhgDqNxaGNH9PkNrwuzE_EwPAWl2R4M"
        target="_blank"
        rel="noopener noreferrer"
        data-platform="YouTube Music"
        aria-label="Listen to Work Hard on YouTube Music"
      >

        <span class="icon youtube">
          ▶
        </span>

        <span class="platform-name">
          YouTube Music
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


    </div>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

      <div class="footer-line"></div>

      <div class="footer-text">
        Powered by OMK Record
      </div>

    </footer>

  </section>

</main>


<!-- =====================================================
     LIGHTWEIGHT CLICK TRACKING
====================================================== -->

<script>

document.addEventListener(
  "click",
  function(event) {

    const link =
      event.target.closest(
        "[data-platform]"
      );

    if (!link) return;

    const platform =
      link.getAttribute(
        "data-platform"
      );

    /*
      This does not delay the redirect.
      It simply records the click in
      the browser console.
    */

    console.log(
      "Work Hard click:",
      platform
    );

  },
  {
    passive: true
  }
);

</script>

</body>
</html>
