<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="description"
  content="Listen to Work Hard by Omo Taker on Apple Music, Spotify, Audiomack, Boomplay and YouTube Music."
>

<meta name="theme-color" content="#03060d">

<title>Work Hard — Omo Taker</title>

<link
  rel="preconnect"
  href="https://raw.githubusercontent.com"
  crossorigin
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(0, 76, 255, 0.17),
      transparent 35%
    ),
    radial-gradient(
      circle at 50% 55%,
      rgba(0, 45, 130, 0.10),
      transparent 42%
    ),
    #03060d;

  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeSpeed;
}

/* =====================================================
   MAIN PAGE
===================================================== */

.page {
  width: 100%;
  max-width: 720px;

  margin: 0 auto;

  padding:
    10px
    10px
    32px;
}

/* =====================================================
   MAIN CARD
===================================================== */

.card {
  width: 100%;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 27px;

  background:
    linear-gradient(
      180deg,
      #07101f 0%,
      #050912 47%,
      #03050a 100%
    );

  box-shadow:
    0 28px 90px rgba(0,0,0,.48);
}

/* =====================================================
   WORK HARD ARTWORK
===================================================== */

.artwork-wrap {
  padding: 12px 12px 0;
}

.artwork {
  display: block;

  width: 100%;
  height: auto;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  border-radius: 21px;

  background: #07101d;

  /*
    The cover is the first important visual,
    so the browser loads it with high priority.
  */

  fetchpriority: high;

  decoding: async;
}

/* =====================================================
   SONG INFORMATION
===================================================== */

.song-info {
  text-align: center;

  padding:
    31px
    18px
    4px;
}

.song-title {
  color: #ffffff;

  font-size:
    clamp(
      43px,
      10vw,
      66px
    );

  line-height: .92;

  letter-spacing: -3.6px;

  font-weight: 950;
}

.artist {
  margin-top: 10px;

  color: #aeb4c0;

  font-size: 16px;

  font-weight: 500;
}

/* =====================================================
   LISTEN TEXT
===================================================== */

.listen-heading {
  padding:
    27px
    14px
    15px;

  text-align: center;

  color: #8ea7d9;

  font-size: 10px;

  line-height: 1.2;

  font-weight: 900;

  letter-spacing: 3px;

  text-transform: uppercase;
}

/* =====================================================
   STREAMING PLATFORM BUTTONS
===================================================== */

.platform-list {
  display: grid;

  gap: 11px;

  padding:
    0
    18px
    8px;
}

.platform {
  width: 100%;

  min-height: 67px;

  display: flex;

  align-items: center;

  gap: 16px;

  padding:
    0
    18px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 18px;

  background:
    linear-gradient(
      90deg,
      #111722,
      #1a2230
    );

  color: #ffffff;

  text-decoration: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    transform .12s ease,
    background .12s ease;
}

.platform:hover {
  background:
    linear-gradient(
      90deg,
      #151d29,
      #202b3c
    );
}

.platform:active {
  transform: scale(.985);
}

/* =====================================================
   ICON
===================================================== */

.platform-icon {
  width: 43px;
  height: 43px;

  flex-shrink: 0;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: 900;
}

/* Apple Music */

.apple {
  background: #ff375f;

  color: #ffffff;

  font-size: 25px;
}

/* Spotify */

.spotify {
  background: #1ed760;

  color: #07100b;

  font-size: 21px;
}

/* Audiomack */

.audiomack {
  background: #111111;

  color: #ff9800;

  font-size: 25px;
}

/* Boomplay */

.boomplay {
  background: #08d9e8;

  color: #061017;

  font-size: 25px;
}

/* YouTube Music */

.youtube {
  background: #ff0000;

  color: #ffffff;

  font-size: 18px;
}

/* =====================================================
   PLATFORM NAME
===================================================== */

.platform-name {
  flex: 1;

  font-size: 17px;

  line-height: 1;

  font-weight: 750;

  letter-spacing: -.25px;
}

/* =====================================================
   ARROW
===================================================== */

.platform-arrow {
  color: #ffffff;

  font-size: 28px;

  line-height: 1;

  font-weight: 300;

  opacity: .95;
}

/* =====================================================
   FOOTER
===================================================== */

.footer {
  padding:
    25px
    20px
    29px;

  text-align: center;
}

.footer-line {
  width: 72px;

  height: 1px;

  margin:
    0 auto
    12px;

  background:
    rgba(255,255,255,.18);
}

.footer-text {
  color: #697487;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 3px;

  text-transform: uppercase;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 520px) {

  .page {
    padding:
      7px
      8px
      25px;
  }

  .card {
    border-radius: 24px;
  }

  .artwork-wrap {
    padding:
      9px
      9px
      0;
  }

  .artwork {
    border-radius: 19px;
  }

  .song-info {
    padding-top: 28px;
  }

  .song-title {
    letter-spacing: -3px;
  }

  .artist {
    font-size: 15px;
  }

  .listen-heading {
    padding-top: 25px;

    font-size: 9px;

    letter-spacing: 2.7px;
  }

  .platform-list {
    padding:
      0
      13px
      7px;

    gap: 10px;
  }

  .platform {
    min-height: 64px;

    padding:
      0
      14px;

    border-radius: 16px;

    gap: 14px;
  }

  .platform-icon {
    width: 42px;
    height: 42px;

    border-radius: 11px;
  }

  .platform-name {
    font-size: 16px;
  }

  .platform-arrow {
    font-size: 26px;
  }

}

/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 370px) {

  .song-title {
    font-size: 40px;
  }

  .platform {
    min-height: 61px;
  }

  .platform-icon {
    width: 39px;
    height: 39px;
  }

  .platform-name {
    font-size: 15px;
  }

}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

  .platform {
    transition: none;
  }

}

</style>

</head>

<body>

<main class="page">

  <section class="card">

    <!-- ===============================================
         WORK HARD COVER
    ================================================ -->

    <div class="artwork-wrap">

      <img
        class="artwork"
        src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/CFC9C620-39B2-4308-83EA-DA63B4B2B665.png"
        alt="Work Hard by Omo Taker"
        width="700"
        height="700"
        fetchpriority="high"
        decoding="async"
      >

    </div>


    <!-- ===============================================
         SONG TITLE
    ================================================ -->

    <div class="song-info">

      <h1 class="song-title">
        Work Hard
      </h1>

      <p class="artist">
        Omo Taker • Single
      </p>

    </div>


    <!-- ===============================================
         ONE INSTRUCTION ONLY
    ================================================ -->

    <div class="listen-heading">
      Listen on your favorite platform
    </div>


    <!-- ===============================================
         PLATFORMS
    ================================================ -->

    <div class="platform-list">


      <!-- APPLE MUSIC -->

      <a
        class="platform"
        href="https://music.apple.com/ng/album/work-hard-single/6808988385"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Listen to Work Hard on Apple Music"
      >

        <span class="platform-icon apple">
          ♪
        </span>

        <span class="platform-name">
          Apple Music
        </span>

        <span class="platform-arrow">
          ›
        </span>

      </a>


      <!-- SPOTIFY -->

      <a
        class="platform"
        href="https://open.spotify.com/album/3Fl2WM9a0tOKUdzcbsiK2E?si=2ZxViGZmTiKfdDA8FF_1hA&utm_source=copy-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Listen to Work Hard on Spotify"
      >

        <span class="platform-icon spotify">
          ●
        </span>

        <span class="platform-name">
          Spotify
        </span>

        <span class="platform-arrow">
          ›
        </span>

      </a>


      <!-- AUDIOMACK -->

      <a
        class="platform"
        href="https://audiomack.com/iam_omotaker/song/work-hard?share-user-id=111838460"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Listen to Work Hard on Audiomack"
      >

        <span class="platform-icon audiomack">
          〽
        </span>

        <span class="platform-name">
          Audiomack
        </span>

        <span class="platform-arrow">
          ›
        </span>

      </a>


      <!-- BOOMPLAY -->

      <a
        class="platform"
        href="https://www.boomplay.com/share/album/EQU5SNbgs04WQgScvWRJwfI7?srModel=Linkfire&srList=eeffdc963721d692e77fb31ce3ce9caf"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Listen to Work Hard on Boomplay"
      >

        <span class="platform-icon boomplay">
          B
        </span>

        <span class="platform-name">
          Boomplay
        </span>

        <span class="platform-arrow">
          ›
        </span>

      </a>


      <!-- YOUTUBE MUSIC -->

      <a
        class="platform"
        href="https://music.youtube.com/playlist?list=OLAK5uy_mWzhgDqNxaGNH9PkNrwuzE_EwPAWl2R4M"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Listen to Work Hard on YouTube Music"
      >

        <span class="platform-icon youtube">
          ▶
        </span>

        <span class="platform-name">
          YouTube Music
        </span>

        <span class="platform-arrow">
          ›
        </span>

      </a>


    </div>


    <!-- ===============================================
         ONLY FOOTER TEXT
    ================================================ -->

    <footer class="footer">

      <div class="footer-line"></div>

      <div class="footer-text">
        Powered by OMK Record
      </div>

    </footer>

  </section>

</main>

</body>
</html>
