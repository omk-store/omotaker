<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Follow Follow — Omo Taker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.94)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(22px);
transform:scale(1.15);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:22px 16px 50px;
}

/* COVER */

.cover{
width:100%;
border-radius:32px;
display:block;
box-shadow:0 15px 50px rgba(0,0,0,.55);
cursor:pointer;
}

/* INFO */

.info{
background:#0e0e0e;
padding:18px;
text-align:center;
border-radius:0 0 32px 32px;
margin-top:-5px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.04);
cursor:pointer;
}

.omk{
font-size:13px;
font-weight:900;
letter-spacing:5px;
color:#ff6200;
text-transform:uppercase;
}

/* PLATFORM BOX */

.platform-box{
width:100%;
background:#fff;
border-radius:34px;
padding:22px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
display:flex;
flex-direction:column;
gap:16px;
}

/* BUTTON */

.platform-btn{
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
padding:20px;
border-radius:24px;
transition:.2s ease;
}

.platform-btn:active{
transform:scale(.98);
}

.platform-left{
display:flex;
align-items:center;
gap:16px;
}

.platform-left img{
width:44px;
height:44px;
object-fit:contain;
}

.platform-left span{
font-size:22px;
font-weight:900;
color:#fff;
}

.play-btn{
background:#fff;
color:#111;
padding:12px 22px;
border-radius:16px;
font-size:16px;
font-weight:900;
}

/* PLATFORM COLORS */

.spotify{
background:#1ed760;
}

.apple{
background:#fc3c44;
}

.audiomack{
background:#ffb300;
}

.boomplay{
background:#00c853;
}

.youtube{
background:#ff0000;
}

.tiktok{
background:#111;
border:1px solid rgba(255,255,255,.08);
}

/* TEXT */

.save-text{
text-align:center;
margin-top:22px;
font-size:14px;
line-height:1.7;
color:#bdbdbd;
font-weight:500;
}

.save-text .plus{
color:#1ed760;
font-size:24px;
font-weight:900;
vertical-align:middle;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:28px;
font-size:13px;
color:#9e9e9e;
letter-spacing:1px;
}

</style>
</head>
