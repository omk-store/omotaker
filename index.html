<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Follow Follow — Omo Taker</title>

<meta name="theme-color" content="#111111">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0d0d0d;
color:#fff;
overflow-x:hidden;
}

/* BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.92)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(18px);
transform:scale(1.1);
z-index:-2;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:22px 16px 60px;
}

/* COVER */

.cover{
width:100%;
border-radius:24px;
display:block;
box-shadow:0 10px 40px rgba(0,0,0,.45);
}

/* INFO */

.info{
background:#1a1a1a;
padding:30px 24px;
text-align:center;
border-radius:0 0 24px 24px;
margin-top:-5px;
margin-bottom:26px;
}

.logo{
width:42px;
height:42px;
margin:auto;
margin-bottom:18px;
opacity:.95;
}

h1{
font-size:38px;
font-weight:900;
line-height:1;
margin-bottom:12px;
}

.artist{
font-size:18px;
color:#d5d5d5;
line-height:1.6;
margin-bottom:10px;
}

.caption{
font-size:15px;
color:#b8b8b8;
line-height:1.7;
}

/* STREAMING */

.stream-box{
width:100%;
background:#fff;
border-radius:24px;
overflow:hidden;
box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.stream-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 18px;
border-bottom:1px solid #ececec;
text-decoration:none;
background:#fff;
}

.stream-row:last-child{
border-bottom:none;
}

.stream-left{
display:flex;
align-items:center;
gap:14px;
}

.stream-left img{
width:38px;
height:38px;
object-fit:contain;
}

.stream-left span{
font-size:20px;
font-weight:700;
color:#111;
}

.stream-play{
padding:12px 26px;
border:1px solid #dcdcdc;
border-radius:14px;
font-size:16px;
font-weight:600;
color:#444;
background:#fafafa;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:28px;
font-size:13px;
color:#b5b5b5;
line-height:2;
}

.domain{
display:inline-block;
margin-top:12px;
padding:12px 24px;
background:#1c1c1c;
border-radius:999px;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<!-- COVER -->

<img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png"
class="cover">

<!-- INFO -->

<div class="info">

<img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg"
class="logo">

<h1>FOLLOW FOLLOW</h1>

<div class="artist">
Omo Taker 🐺📯🔥
</div>

<div class="caption">
The sound everybody dey FOLLOW FOLLOW.
</div>

</div>

<!-- STREAM LINKS -->

<div class="stream-box">

<a href="#" class="stream-row">
<div class="stream-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
<span>Spotify</span>
</div>
<div class="stream-play">Play</div>
</a>

<a href="#" class="stream-row">
<div class="stream-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/d/de/Apple_Music_icon.svg">
<span>Apple Music</span>
</div>
<div class="stream-play">Play</div>
</a>

<a href="#" class="stream-row">
<div class="stream-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/2/20/YouTube_2024.svg">
<span>YouTube Music</span>
</div>
<div class="stream-play">Play</div>
</a>

<a href="#" class="stream-row">
<div class="stream-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Audiomack-logo.png">
<span>Audiomack</span>
</div>
<div class="stream-play">Play</div>
</a>

<a href="#" class="stream-row">
<div class="stream-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Boomplay_logo.png">
<span>Boomplay</span>
</div>
<div class="stream-play">Play</div>
</a>

</div>

<!-- FOOTER -->

<div class="footer">

FOLLOW FOLLOW — OUT NOW 🔥

<div class="domain">
omotaker.com
</div>

</div>

</div>

</body>
</html>
