<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Omo Taker - Follow Follow</title>
  <meta name="description" content="Stream Follow Follow by Omo Taker on Spotify." />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-XXXXXXXXXX");
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(30, 215, 96, 0.35), transparent 30%),
        linear-gradient(180deg, #121212, #000000);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(18, 18, 18, 0.92);
      border: 1px solid rgba(30, 215, 96, 0.25);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.7);
    }

    .logo {
      font-size: 14px;
      letter-spacing: 3px;
      color: #1DB954;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .cover {
      width: 100%;
      border-radius: 22px;
      margin-bottom: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .artist {
      color: #b3b3b3;
      font-size: 17px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      background: rgba(30, 215, 96, 0.13);
      color: #1DB954;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 22px;
      font-weight: bold;
    }

    .btn {
      display: block;
      width: 100%;
      background: #1DB954;
      color: #000;
      text-decoration: none;
      padding: 17px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(30, 215, 96, 0.35);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .small {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .loader {
      margin: 18px auto 5px;
      width: 34px;
      height: 34px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top: 4px solid #1DB954;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spotify-frame {
      margin-top: 20px;
      border-radius: 14px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">OMK · SPOTIFY RELEASE</div>

    <img src="cover.jpg" alt="Follow Follow Cover Art" class="cover" />

    <h1>Follow Follow</h1>
    <p class="artist">Omo Taker</p>

    <div class="tag">Out Now · Tap to Stream</div>

    <a
      class="btn"
      id="spotifyBtn"
      href="https://open.spotify.com/track/7L4J10wzvkcuTB1zhguCMr"
    >
      Play on Spotify
    </a>

    <div class="loader"></div>

    <p class="small">
      Opening Spotify automatically. If it does not open, tap the green button.
    </p>

    <div class="spotify-frame">
      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/7L4J10wzvkcuTB1zhguCMr?utm_source=generator"
        width="100%"
        height="152"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </main>

  <script>
    const spotifyUrl = "https://open.spotify.com/track/7L4J10wzvkcuTB1zhguCMr";
    const btn = document.getElementById("spotifyBtn");

    btn.addEventListener("click", function () {
      gtag("event", "spotify_click", {
        event_category: "music",
        event_label: "Follow Follow - Omo Taker"
      });
    });

    setTimeout(function () {
      gtag("event", "auto_redirect_attempt", {
        event_category: "music",
        event_label: "Follow Follow - Spotify"
      });

      window.location.href = spotifyUrl;
    }, 1800);
  </script>
</body>
</html>
