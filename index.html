<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Follow Follow — Omo Taker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
cursor:pointer;
}

/* BACKGROUND */

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.94)),
url('https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png');
background-size:cover;
background-position:center;
filter:blur(22px);
transform:scale(1.15);
z-index:-1;
}

/* CONTAINER */

.container{
max-width:520px;
margin:auto;
padding:22px 16px 50px;
}

/* COVER */

.cover{
width:100%;
border-radius:32px;
display:block;
box-shadow:0 15px 50px rgba(0,0,0,.55);
}

/* INFO */

.info{
background:#0e0e0e;
padding:18px;
text-align:center;
border-radius:0 0 32px 32px;
margin-top:-5px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.04);
}

.omk{
font-size:13px;
font-weight:900;
letter-spacing:5px;
color:#ff6200;
text-transform:uppercase;
}

/* SPOTIFY BOX */

.spotify-box{
width:100%;
background:#fff;
border-radius:34px;
padding:22px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

/* SPOTIFY BUTTON */

.spotify-btn{
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
background:#1ed760;
padding:24px 20px;
border-radius:26px;
transition:.2s ease;
}

.spotify-btn:active{
transform:scale(.98);
}

.spotify-left{
display:flex;
align-items:center;
gap:16px;
}

.spotify-left img{
width:50px;
height:50px;
object-fit:contain;
}

.spotify-left span{
font-size:26px;
font-weight:900;
color:#fff;
}

.play-btn{
background:#fff;
color:#111;
padding:14px 28px;
border-radius:18px;
font-size:20px;
font-weight:900;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:28px;
font-size:13px;
color:#9e9e9e;
letter-spacing:1px;
}

</style>
</head>

<body onclick="window.location.href='https://open.spotify.com/album/4wQrUmEzJO2ex7AszfSq0e?si=tYcZUNZwQZ2Ip_AbRZ3U4Q'">

<div class="container">

<!-- COVER -->

<img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/9C635876-12E8-416C-9320-6F62D0C831D8.png"
class="cover">

<!-- INFO -->

<div class="info">

<div class="omk">
OMK RECORDS
</div>

</div>

<!-- SPOTIFY -->

<div class="spotify-box">

<a href="https://open.spotify.com/album/4wQrUmEzJO2ex7AszfSq0e?si=tYcZUNZwQZ2Ip_AbRZ3U4Q"
target="_blank"
class="spotify-btn">

<div class="spotify-left">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
<span>Spotify</span>
</div>

<div class="play-btn">
PLAY
</div>

</a>

</div>

<!-- FOOTER -->

<div class="footer">
OMK RECORDS © 2026
</div>

</div>

</body>
</html>
