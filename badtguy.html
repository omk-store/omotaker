<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badt Guy – Omo Taker</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: radial-gradient(circle at top, #0a0a0a, #000);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

/* GLOW BACKGROUND */
body::before {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(255,0,80,0.35), transparent);
  filter: blur(140px);
  animation: moveGlow 10s infinite alternate;
}

@keyframes moveGlow {
  from { transform: translate(-120px, -120px); }
  to { transform: translate(120px, 120px); }
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 420px;
  z-index: 2;
}

/* COVER */
.cover {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
}

.cover img {
  width: 100%;
}

/* OVERLAY */
.overlay {
  position: absolute;
  bottom: 0;
  padding: 20px;
  background: linear-gradient(transparent, black);
  width: 100%;
}

/* BADGE */
.badge {
  display: inline-block;
  background: #ff003c;
  padding: 6px 12px;
  font-size: 11px;
  border-radius: 20px;
  margin-bottom: 10px;
}

/* TEXT */
.title {
  font-size: 22px;
  font-weight: bold;
}

.artist {
  font-size: 14px;
  color: #aaa;
}

/* COUNTER */
.counter {
  margin-top: 15px;
  font-size: 15px;
  color: #00ffc3;
}

/* SOCIAL PROOF */
.proof {
  font-size: 12px;
  color: #888;
  margin-top: 5px;
}

/* BUTTON */
.btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 600;
  margin-top: 15px;
  transition: 0.3s;
}

.apple {
  background: linear-gradient(135deg, #ff003c, #ff5e00);
  box-shadow: 0 0 40px rgba(255,0,60,0.6);
}

.spotify {
  background: #111;
  color: #1DB954;
  border: 1px solid #1DB954;
}

.shazam {
  background: #0066ff;
}

/* HOVER */
.btn:hover {
  transform: scale(1.05);
}

/* PRESSURE TEXT */
.pressure {
  font-size: 13px;
  color: #ff5e00;
  text-align: center;
  margin-top: 12px;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">

    <div class="overlay">
      <div class="badge">🔥 13K+ Streams</div>
      <div class="title">Badt Guy</div>
      <div class="artist">Omo Taker 🐺</div>
    </div>
  </div>

  <!-- COUNTER -->
  <div class="counter">
    🔥 <span id="count">0</span> plays
  </div>

  <div class="proof">
    ⚡ People are discovering this sound right now
  </div>

  <!-- APPLE (MAIN) -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614"
     class="btn apple"
     onclick="increaseCount()">
     <span>🍎 Apple Music</span>
     <span>PLAY ▶</span>
  </a>

  <!-- SPOTIFY -->
  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw"
     class="btn spotify"
     onclick="increaseCount()">
     <span>🎧 Spotify</span>
     <span>LISTEN ▶</span>
  </a>

  <!-- SHAZAM -->
  <a href="https://www.shazam.com"
     class="btn shazam"
     onclick="increaseCount()">
     <span>📡 Shazam</span>
     <span>OPEN ▶</span>
  </a>

  <!-- PRESSURE -->
  <div class="pressure">
    🎧 If it hits… play it now. Don’t skip.
  </div>

  <div class="footer">OMK 🐺</div>

</div>

<script>

/* START FROM REAL MOMENTUM */
let count = localStorage.getItem("plays");

if (!count) {
  count = 12000 + Math.floor(Math.random() * 1500);
}

count = parseInt(count);

function updateUI() {
  document.getElementById("count").innerText = count.toLocaleString();
}

function increaseCount() {
  count += Math.floor(Math.random() * 5) + 1;
  localStorage.setItem("plays", count);
  updateUI();
}

updateUI();

</script>

</body>
</html>
