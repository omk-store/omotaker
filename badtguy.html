<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMK Records – Badt Guy</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, Arial;
  color: white;
  background: radial-gradient(circle at top, #050505, #000);
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 420px;
  margin: auto;
  padding-top: 40px;
}

/* COVER */
.cover {
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(255,0,0,0.4);
}

.cover img {
  width: 100%;
}

/* TITLE */
.title {
  font-size: 26px;
  font-weight: bold;
  margin-top: 15px;
}

.artist {
  color: #aaa;
}

/* BIG MAIN STAT */
.main-stat {
  text-align: center;
  margin: 20px 0;
}

.main-number {
  font-size: 36px;
  font-weight: bold;
  color: #ff3c00;
}

.main-label {
  font-size: 12px;
  color: #777;
}

/* SMALL STATS */
.stats {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.stat {
  text-align: center;
}

.number {
  font-size: 18px;
  font-weight: bold;
  color: #ff5e00;
}

.label {
  font-size: 11px;
  color: #777;
}

/* BUTTON */
.btn {
  display: flex;
  justify-content: space-between;
  padding: 16px;
  border-radius: 14px;
  margin-top: 15px;
  text-decoration: none;
  font-weight: bold;
}

.apple {
  background: linear-gradient(135deg, #ff003c, #ff5e00);
}

.spotify {
  border: 1px solid #1DB954;
  color: #1DB954;
}

/* PRESSURE */
.pressure {
  text-align: center;
  margin-top: 18px;
  color: #ff5e00;
  font-size: 13px;
}

/* BRAND */
.brand {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- TITLE -->
  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <!-- MAIN FLEX -->
  <div class="main-stat">
    <div class="main-number" id="total">0</div>
    <div class="main-label">Total Plays</div>
  </div>

  <!-- SECONDARY STATS -->
  <div class="stats">
    <div class="stat">
      <div class="number" id="streams">0</div>
      <div class="label">Streams</div>
    </div>

    <div class="stat">
      <div class="number" id="listeners">0</div>
      <div class="label">Listeners</div>
    </div>

    <div class="stat">
      <div class="number" id="shazams">0</div>
      <div class="label">Shazams</div>
    </div>
  </div>

  <!-- BUTTONS -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" class="btn apple">
    <span>OMK Music</span>
    <span>PLAY ▶</span>
  </a>

  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw" class="btn spotify">
    <span>OMK Stream</span>
    <span>LISTEN ▶</span>
  </a>

  <!-- PRESSURE -->
  <div class="pressure">
    🔥 19,000+ total plays… this one is moving different.
  </div>

  <div class="brand">
    OMK Records 🐺
  </div>

</div>

<script>
function animate(id, target) {
  let count = 0;
  let speed = target / 50;

  let interval = setInterval(() => {
    count += speed;
    if (count >= target) {
      count = target;
      clearInterval(interval);
    }
    document.getElementById(id).innerText =
      Math.floor(count).toLocaleString() + "+";
  }, 30);
}

animate("total", 19000);
animate("streams", 13000);
animate("listeners", 10000);
animate("shazams", 14000);
</script>

</body>
</html>
