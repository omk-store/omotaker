<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badt Guy – Omo Taker</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial;
  background:#000;
  color:white;
}

/* CONTAINER */
.container{
  width:92%;
  max-width:420px;
  margin:auto;
  padding-top:15px;
}

/* COVER */
.cover{
  border-radius:22px;
  overflow:hidden;
}
.cover img{width:100%;}

/* OMK CENTER */
.omk{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  color:#888;
}

/* TITLE */
.title{
  font-size:28px;
  font-weight:800;
  margin-top:10px;
}
.artist{
  color:#aaa;
  margin-top:2px;
}

/* LIVE */
.live{
  margin-top:6px;
  color:#66f5b5;
  font-size:15px;
}

/* BUTTONS (UP NOW) */
.btn{
  display:flex;
  justify-content:space-between;
  padding:16px;
  border-radius:14px;
  margin-top:12px;
  text-decoration:none;
  font-weight:800;
}

/* SPOTIFY FIRST */
.spotify{
  border:1.5px solid #1DB954;
  color:#1DB954;
}

/* APPLE */
.apple{
  background:linear-gradient(135deg,#ff003c,#ff6a00);
  color:white;
}

/* STATS LINE (ONE ROW) */
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  padding:10px 0;
}

.stat{
  text-align:center;
  flex:1;
}

.stat strong{
  color:#ff5e00;
  font-size:20px;
}

.stat span{
  display:block;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- OMK -->
  <div class="omk">OMK 🐺</div>

  <!-- TITLE -->
  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <!-- LIVE -->
  <div class="live">
    👀 <span id="liveCount">156</span> people listening now
  </div>

  <!-- BUTTONS (UP) -->
  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw" class="btn spotify">
    <span>Spotify</span>
    <span>LISTEN ▶</span>
  </a>

  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" class="btn apple">
    <span>Apple Music</span>
    <span>PLAY ▶</span>
  </a>

  <!-- CLEAN STATS (ONE LINE) -->
  <div class="stats">
    <div class="stat">
      <strong>19K+</strong>
      <span>Plays</span>
    </div>

    <div class="stat">
      <strong>12K+</strong>
      <span>Listeners</span>
    </div>

    <div class="stat">
      <strong>10K+</strong>
      <span>Shazams</span>
    </div>
  </div>

</div>

<script>
let live = 156;

function updateLive(){
  let change = Math.floor(Math.random()*30)-15;
  live += change;

  if(live < 120) live = 140;
  if(live > 280) live = 190;

  document.getElementById("liveCount").innerText = live;
}

setInterval(updateLive, 2000);
</script>

</body>
</html>
