<style>
body{
  margin:0;
  font-family:-apple-system,Arial;
  background:radial-gradient(circle at top,#0a0a0a,#000);
  color:white;
}

.container{
  width:92%;
  max-width:420px;
  margin:auto;
  padding-top:20px;
}

/* COVER */
.cover{
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 80px rgba(255,80,0,.45);
}
.cover img{width:100%;}

/* NAME */
.name{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-top:15px;
}

/* 🔥 MAIN CTA TEXT */
.cta{
  text-align:center;
  margin-top:12px;
  font-size:15px;
  color:#ff6a2a;
  line-height:1.4;
  font-weight:600;
}

/* BUTTONS */
.btn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-radius:16px;
  margin-top:18px;
  text-decoration:none;
  font-weight:900;
  transition:0.2s;
}

.btn:hover{
  transform:scale(1.04);
}

/* 🔥 MAIN BUTTON (SPOTIFY) */
.main{
  background:linear-gradient(135deg,#1DB954,#0f7a3c);
  color:white;
  box-shadow:0 0 30px rgba(29,185,84,0.8);
  font-size:18px;
  animation:pulse 1.8s infinite;
}

/* SECONDARY */
.secondary{
  border:1.5px solid #ff5e00;
  color:#ff5e00;
  box-shadow:0 0 20px rgba(255,94,0,0.4);
}

/* SMALL JOIN (LOW PRIORITY) */
.join{
  margin-top:25px;
  font-size:13px;
  text-align:center;
  color:#777;
}

/* PULSE */
@keyframes pulse{
  0%{box-shadow:0 0 15px rgba(29,185,84,0.6);}
  50%{box-shadow:0 0 35px rgba(29,185,84,1);}
  100%{box-shadow:0 0 15px rgba(29,185,84,0.6);}
}

<div class="container">

  <!-- COVER -->

     target="_blank"
     class="btn secondary"
     onclick="gtag('event','apple_click',{
       event_category:'music',
