<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badt Guy – Omo Taker</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  background:#000;
  color:white;
}
.container{
  width:92%;
  max-width:420px;
  margin:auto;
  padding:30px 0;
}
.cover{
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 70px rgba(255,60,0,.35);
}
.cover img{width:100%;display:block;}
.title{
  font-size:30px;
  font-weight:800;
  margin-top:18px;
}
.artist{
  font-size:18px;
  color:#aaa;
  margin-top:4px;
}
.live{
  margin-top:14px;
  color:#66f5b5;
  font-size:17px;
}
.main-stat{
  text-align:center;
  margin:30px 0 22px;
}
.main-stat h1{
  margin:0;
  font-size:58px;
  color:#ff4b22;
}
.main-stat span{
  color:#999;
  font-size:15px;
}
.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:28px;
}
.stat{text-align:center;}
.stat strong{
  display:block;
  color:#ff6a2a;
  font-size:24px;
}
.stat span{
  color:#888;
  font-size:14px;
}
.btn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-radius:16px;
  margin-top:16px;
  text-decoration:none;
  font-weight:800;
  font-size:18px;
}
.apple{
  background:linear-gradient(135deg,#ff003c,#ff6a00);
  color:white;
}
.spotify{
  border:1.5px solid #1DB954;
  color:#1DB954;
}
.pressure{
  text-align:center;
  margin-top:25px;
  color:#ff6a2a;
  font-size:15px;
}
.brand{
  text-align:center;
  color:#555;
  margin-top:22px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <div class="live">
    👀 <span id="liveCount">156</span> people listening now
  </div>

  <div class="main-stat">
    <h1 id="total">0</h1>
    <span>Total Plays</span>
  </div>

  <div class="stats">
    <div class="stat">
      <strong id="plays">0</strong>
      <span>Plays</span>
    </div>
    <div class="stat">
      <strong id="listeners">0</strong>
      <span>Listeners</span>
    </div>
    <div class="stat">
      <strong id="shazams">0</strong>
      <span>Shazams</span>
    </div>
  </div>

  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" class="btn apple">
    <span>Apple Music</span>
    <span>PLAY ▶</span>
  </a>

  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw" class="btn spotify">
    <span>Spotify</span>
    <span>LISTEN ▶</span>
  </a>

  <div class="pressure">
    🔥 19K+ total plays… this record is moving.
  </div>

  <div class="brand">OMK Records 🐺</div>

</div>

<script>
function animate(id, target, suffix="+") {
  let count = 0;
  let step = target / 45;

  let run = setInterval(() => {
    count += step;
    if (count >= target) {
      count = target;
      clearInterval(run);
    }
    document.getElementById(id).innerText =
      Math.floor(count).toLocaleString() + suffix;
  }, 25);
}

animate("total", 19000);
animate("plays", 19000);
animate("listeners", 12000);
animate("shazams", 10000);

let live = 156;
function updateLive(){
  live += Math.floor(Math.random() * 41) - 20;
  if(live < 95) live = 121;
  if(live > 260) live = 188;
  document.getElementById("liveCount").innerText = live;
}
setInterval(updateLive, 2500);
</script>

</body>
</html>
