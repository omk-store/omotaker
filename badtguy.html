<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMK Records – Badt Guy</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial;
  background:#000;
  color:white;
}

.container{
  width:92%;
  max-width:420px;
  margin:auto;
  padding-top:18px;
}

/* COVER */
.cover{
  border-radius:20px;
  overflow:hidden;
}
.cover img{width:100%;}

/* OMK CENTER */
.omk{
  text-align:center;
  font-size:12px;
  color:#666;
  margin-top:6px;
}

/* TITLE */
.title{
  font-size:26px;
  font-weight:800;
  margin-top:12px;
}
.artist{
  color:#aaa;
  font-size:16px;
}

/* LIVE */
.live{
  margin-top:6px;
  color:#66f5b5;
  font-size:15px;
}

/* INLINE STATS */
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
}

.stat{
  text-align:center;
  flex:1;
}

.stat strong{
  display:block;
  font-size:20px;
  color:#ff5a2a;
}

.stat span{
  font-size:11px;
  color:#777;
}

/* BUTTONS */
.btn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px;
  border-radius:14px;
  margin-top:12px;
  text-decoration:none;
  font-weight:800;
}

/* APPLE */
.apple{
  background:linear-gradient(135deg,#ff003c,#ff6a00);
  color:white;
}

/* SPOTIFY */
.spotify{
  border:1.5px solid #1DB954;
  color:#1DB954;
}

</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- OMK CENTER -->
  <div class="omk">OMK Records 🐺</div>

  <!-- TITLE -->
  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <!-- LIVE -->
  <div class="live">
    👀 <span id="liveCount">142</span> people listening now
  </div>

  <!-- INLINE STATS -->
  <div class="stats">

    <div class="stat">
      <strong>19K+</strong>
      <span>Plays</span>
    </div>

    <div class="stat">
      <strong>12K+</strong>
      <span>Listeners</span>
    </div>

    <div class="stat">
      <strong>10K+</strong>
      <span>Shazams</span>
    </div>

  </div>

  <!-- BUTTONS (PULLED UP) -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" class="btn apple">
    <span>Apple Music</span>
    <span>PLAY ▶</span>
  </a>

  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw" class="btn spotify">
    <span>Spotify</span>
    <span>LISTEN ▶</span>
  </a>

</div>

<script>
let live = 142;

function updateLive(){
  let change = Math.floor(Math.random()*25)-12;
  live += change;

  if(live < 120) live = 135;
  if(live > 260) live = 180;

  document.getElementById("liveCount").innerText = live;
}

setInterval(updateLive, 2000);
</script>

</body>
</html>
