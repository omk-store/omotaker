<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badt Guy – Omo Taker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(270deg, #020617, #001f2f, #020617);
  background-size: 600% 600%;
  animation: bgMove 10s ease infinite;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

@keyframes bgMove {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

.container {
  width: 90%;
  max-width: 400px;
  text-align: center;
}

.cover {
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}

.cover img {
  width: 100%;
}

@keyframes float {
  0% {transform: translateY(0px);}
  50% {transform: translateY(-10px);}
  100% {transform: translateY(0px);}
}

h1 {
  font-size: 26px;
  margin: 10px 0 5px;
}

p {
  color: #aaa;
}

.counter {
  margin: 15px 0;
  font-size: 16px;
  color: #00ffc3;
}

.goal {
  font-size: 13px;
  color: #888;
}

.live {
  font-size: 12px;
  color: #ff5e00;
  margin-top: 5px;
}

.btn {
  display: block;
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 20px;
  background: linear-gradient(135deg, #ff003c, #ff5e00);
  color: white;
  box-shadow: 0 10px 40px rgba(255,0,60,0.5);
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- TITLE -->
  <h1>Badt Guy 🔥</h1>
  <p>No skips… just vibe 🎧🐺</p>

  <!-- COUNTER -->
  <div class="counter">
    🔥 <span id="count">0</span> plays
  </div>

  <div class="goal">
    ⏳ <span id="remaining">2000</span> to reach 2,000 plays
  </div>

  <div class="live">
    🔴 <span id="live">23</span> people listening now
  </div>

  <!-- BUTTON -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614"
     class="btn"
     onclick="increaseCount()">
     🎧 Play on Apple Music
  </a>

  <!-- PRESSURE TEXT -->
  <div style="margin-top:10px; font-size:12px; color:#ff5e00;">
    ⚡ Play it now… everyone’s tapping in
  </div>

</div>

<script>

// START COUNT SMART
let count = localStorage.getItem("plays");

if (!count) {
  count = 1347 + Math.floor(Math.random() * 200);
}

count = parseInt(count);

// UPDATE UI
function updateUI() {
  document.getElementById("count").innerText = count;

  let goal = 2000;
  let remaining = goal - count;
  if (remaining < 0) remaining = 0;

  document.getElementById("remaining").innerText = remaining;

  // URGENCY SWITCH
  if (remaining <= 200) {
    document.querySelector(".goal").innerText = "⚡ Almost there… don’t miss it";
  }
}

// INCREASE ON CLICK
function increaseCount() {
  count += Math.floor(Math.random() * 3) + 1;
  localStorage.setItem("plays", count);
  updateUI();
}

// LIVE LISTENERS FAKE
function updateLive() {
  let live = 15 + Math.floor(Math.random() * 20);
  document.getElementById("live").innerText = live;
}

setInterval(updateLive, 3000);

// AUTO REDIRECT AFTER 5s
setTimeout(() => {
  window.location.href = "https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614";
}, 5000);

updateUI();

</script>

</body>
</html>
