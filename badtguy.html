<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badt Guy – Omo Taker</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial;
  background: radial-gradient(circle at top, #050505, #000);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 420px;
}

/* COVER */
.cover {
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 0 60px rgba(255,0,0,0.3);
}

.cover img {
  width: 100%;
}

/* TITLE */
.title {
  font-size: 24px;
  font-weight: bold;
}

.artist {
  color: #aaa;
  margin-bottom: 15px;
}

/* BIG STATS */
.stats {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.stat-box {
  flex: 1;
  text-align: center;
}

.stat-number {
  font-size: 20px;
  font-weight: bold;
  color: #ff3c00;
}

.stat-label {
  font-size: 11px;
  color: #777;
}

/* BUTTON */
.btn {
  display: flex;
  justify-content: space-between;
  padding: 16px;
  border-radius: 14px;
  margin-top: 15px;
  text-decoration: none;
  font-weight: 600;
  transition: 0.3s;
}

.apple {
  background: linear-gradient(135deg, #ff003c, #ff5e00);
  box-shadow: 0 0 40px rgba(255,0,60,0.6);
}

.spotify {
  background: #111;
  border: 1px solid #1DB954;
  color: #1DB954;
}

.btn:hover {
  transform: scale(1.05);
}

/* PRESSURE TEXT */
.pressure {
  text-align: center;
  margin-top: 18px;
  font-size: 13px;
  color: #ff5e00;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- TITLE -->
  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <!-- REAL STATS -->
  <div class="stats">
    <div class="stat-box">
      <div class="stat-number">13K+</div>
      <div class="stat-label">Streams</div>
    </div>

    <div class="stat-box">
      <div class="stat-number">10K+</div>
      <div class="stat-label">Listeners</div>
    </div>

    <div class="stat-box">
      <div class="stat-number">14K+</div>
      <div class="stat-label">Shazams</div>
    </div>
  </div>

  <!-- APPLE -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614"
     class="btn apple">
     <span>🍎 Apple Music</span>
     <span>PLAY ▶</span>
  </a>

  <!-- SPOTIFY -->
  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw"
     class="btn spotify">
     <span>🎧 Spotify</span>
     <span>LISTEN ▶</span>
  </a>

  <!-- PRESSURE -->
  <div class="pressure">
    🔥 10,000+ people already tapped in… don’t miss this one.
  </div>

  <div class="footer">OMK 🐺</div>

</div>

</body>
</html>
