<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMOTEKA – Badt Guy</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial;
  background:radial-gradient(circle at top,#0a0a0a,#000);
  color:white;
}

/* CONTAINER */
.container{
  width:92%;
  max-width:420px;
  margin:auto;
  padding-top:20px;
}

/* COVER */
.cover{
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 80px rgba(255,80,0,.45);
}
.cover img{width:100%;}

/* NAME */
.name{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-top:15px;
  letter-spacing:1px;
  text-shadow:0 0 12px rgba(255,255,255,0.25);
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-between;
  margin-top:25px;
}

.stat{
  text-align:center;
  flex:1;
}

.stat strong{
  display:block;
  font-size:22px;
  color:#ff5e00;
  text-shadow:0 0 10px rgba(255,94,0,0.6);
}

.stat span{
  font-size:12px;
  color:#777;
}

/* BUTTONS */
.btn{
  display:flex;
  justify-content:space-between;
  padding:17px;
  border-radius:15px;
  margin-top:18px;
  text-decoration:none;
  font-weight:800;
  backdrop-filter:blur(10px);
  transition:0.2s;
}

/* HOVER */
.btn:hover{
  transform:scale(1.03);
}

/* APPLE */
.apple{
  background:linear-gradient(135deg,#ff003c,#ff6a00);
  color:white;
  box-shadow:0 0 25px rgba(255,60,0,0.6);
}

/* SPOTIFY */
.spotify{
  border:1.5px solid #1DB954;
  color:#1DB954;
  box-shadow:0 0 20px rgba(29,185,84,0.4);
  animation:pulse 2s infinite;
}

/* PULSE ANIMATION */
@keyframes pulse{
  0%{box-shadow:0 0 10px rgba(29,185,84,0.4);}
  50%{box-shadow:0 0 25px rgba(29,185,84,0.8);}
  100%{box-shadow:0 0 10px rgba(29,185,84,0.4);}
}

/* MESSAGE */
.message{
  text-align:center;
  margin-top:20px;
  color:#ff6a2a;
  font-size:14px;
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:25px;
  font-size:12px;
  color:#555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- MAIN NAME -->
  <div class="name">Omo Taker 🐺🎶📯</div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <strong id="plays">0</strong>
      <span>Total Plays</span>
    </div>

    <div class="stat">
      <strong id="listeners">0</strong>
      <span>Listeners</span>
    </div>

    <div class="stat">
      <strong id="shazams">0</strong>
      <span>Shazams</span>
    </div>
  </div>

  <!-- BUTTONS -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" target="_blank" class="btn apple">
    <span>Apple Music</span>
    <span>PLAY ▶</span>
  </a>

  <a id="spotifyBtn" href="https://open.spotify.com/album/126dI3vQGGZSuKxkQ8nVs9" target="_blank" class="btn spotify">
    <span>Spotify</span>
    <span>PLAY NOW ▶</span>
  </a>

  <!-- MESSAGE -->
  <div class="message">
    🔥 19,000+ people already tapped in… hit PLAY & feel it now.
  </div>

  <!-- FOOTER -->
  <div class="footer">
    OMK Records 🐺
  </div>

</div>

<script>
function animate(id, target){
  let count = 0;
  let step = target / 40;

  let run = setInterval(()=>{
    count += step;
    if(count >= target){
      count = target;
      clearInterval(run);
    }
    document.getElementById(id).innerText =
      Math.floor(count).toLocaleString() + "+";
  }, 30);
}

animate("plays", 19000);
animate("listeners", 12000);
animate("shazams", 10000);

/* AUTO OPEN SPOTIFY AFTER 2.5s */
setTimeout(()=>{
  window.open(document.getElementById("spotifyBtn").href, "_blank");
}, 2500);
</script>

</body>
</html>
