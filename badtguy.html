<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badt Guy – Omo Taker</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #000;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 420px;
}

/* COVER */
.cover {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
}

.cover img {
  width: 100%;
  display: block;
}

/* OVERLAY TEXT */
.overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  background: linear-gradient(transparent, black);
}

.title {
  font-size: 22px;
  font-weight: bold;
}

.artist {
  font-size: 14px;
  color: #aaa;
}

/* COUNTER */
.counter {
  margin-top: 15px;
  font-size: 15px;
  color: #00ffc3;
}

/* BUTTONS */
.btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 600;
  margin-top: 15px;
  transition: 0.3s;
}

/* APPLE MAIN */
.apple {
  background: linear-gradient(135deg, #ff003c, #ff5e00);
  box-shadow: 0 0 30px rgba(255,0,60,0.5);
}

/* SPOTIFY */
.spotify {
  background: #111;
  color: #1DB954;
  border: 1px solid #1DB954;
}

/* HOVER */
.btn:hover {
  transform: scale(1.04);
}

/* PRESSURE */
.pressure {
  font-size: 12px;
  color: #ff5e00;
  margin-top: 10px;
  text-align: center;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">

    <div class="overlay">
      <div class="title">Badt Guy 🔥</div>
      <div class="artist">Omo Taker 🐺</div>
    </div>
  </div>

  <!-- COUNTER -->
  <div class="counter">
    🔥 <span id="count">0</span> plays
  </div>

  <!-- APPLE -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614"
     class="btn apple"
     onclick="increaseCount()">
     <span>🍎 Apple Music</span>
     <span>PLAY ▶</span>
  </a>

  <!-- SPOTIFY -->
  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw"
     class="btn spotify"
     onclick="increaseCount()">
     <span>🎧 Spotify</span>
     <span>LISTEN ▶</span>
  </a>

  <!-- PRESSURE -->
  <div class="pressure">
    ⚡ Play it now… don’t miss this vibe
  </div>

  <!-- FOOTER -->
  <div class="footer">
    OMK 🐺
  </div>

</div>

<script>

// SMART START
let count = localStorage.getItem("plays");

if (!count) {
  count = 1500 + Math.floor(Math.random() * 400);
}

count = parseInt(count);

function updateUI() {
  document.getElementById("count").innerText = count;
}

function increaseCount() {
  count += Math.floor(Math.random() * 3) + 1;
  localStorage.setItem("plays", count);
  updateUI();
}

updateUI();

</script>

</body>
</html>
