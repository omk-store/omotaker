<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMK Records – Badt Guy</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, Arial;
  background: #000;
  color: white;
}

/* CONTAINER */
.container {
  width: 92%;
  max-width: 420px;
  margin: auto;
  padding-top: 30px;
}

/* COVER */
.cover {
  border-radius: 20px;
  overflow: hidden;
}

.cover img {
  width: 100%;
}

/* TITLE */
.title {
  font-size: 26px;
  font-weight: bold;
  margin-top: 15px;
}

.artist {
  color: #aaa;
}

/* LIVE LISTENING */
.live {
  margin-top: 10px;
  font-size: 14px;
  color: #00ffc3;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% {opacity: 0.6;}
  50% {opacity: 1;}
  100% {opacity: 0.6;}
}

/* TOTAL */
.total {
  text-align: center;
  margin: 20px 0;
}

.total h1 {
  margin: 0;
  font-size: 34px;
  color: #ff3c00;
}

/* STATS */
.stats {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.stat {
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 18px;
  color: #ff5e00;
}

.stat span {
  font-size: 11px;
  color: #777;
}

/* BUTTONS */
.btn {
  display: flex;
  justify-content: space-between;
  padding: 16px;
  border-radius: 14px;
  margin-top: 15px;
  text-decoration: none;
  font-weight: bold;
}

/* APPLE */
.apple {
  background: #111;
  border: 1px solid #333;
}

.apple span:first-child::before {
  content: "🍎 ";
}

/* SPOTIFY */
.spotify {
  border: 1px solid #1DB954;
  color: #1DB954;
}

.spotify span:first-child::before {
  content: "🎧 ";
}

/* PRESSURE */
.pressure {
  text-align: center;
  margin-top: 18px;
  color: #ff5e00;
  font-size: 13px;
}

/* BRAND */
.brand {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- TITLE -->
  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <!-- LIVE PEOPLE -->
  <div class="live">
    👀 <span id="liveCount">126</span> people listening now
  </div>

  <!-- TOTAL -->
  <div class="total">
    <h1>19,000+</h1>
  </div>

  <!-- REAL STATS -->
  <div class="stats">
    <div class="stat">
      <strong>19K+</strong>
      <span>Total Plays</span>
    </div>

    <div class="stat">
      <strong>10K+</strong>
      <span>Listeners</span>
    </div>

    <div class="stat">
      <strong>14K+</strong>
      <span>Shazams</span>
    </div>
  </div>

  <!-- BUTTONS -->
  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" class="btn apple">
    <span>Apple Music</span>
    <span>PLAY ▶</span>
  </a>

  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw" class="btn spotify">
    <span>Spotify</span>
    <span>LISTEN ▶</span>
  </a>

  <!-- PRESSURE -->
  <div class="pressure">
    🔥 This record is gaining traction right now…
  </div>

  <div class="brand">
    OMK Records 🐺
  </div>

</div>

<script>
let live = 120;

function updateLive() {
  // random realistic fluctuation
  let change = Math.floor(Math.random() * 40) - 20;
  live += change;

  if (live < 80) live = 90;
  if (live > 300) live = 200;

  document.getElementById("liveCount").innerText = live;
}

// update every 2 seconds
setInterval(updateLive, 2000);
</script>

</body>
</html>
