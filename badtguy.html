<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Badt Guy – Omo Taker</title>

<style>
body{
  margin:0;
  font-family:-apple-system,Arial;
  background:#000;
  color:white;
}
.container{
  width:92%;
  max-width:420px;
  margin:auto;
  padding:25px 0;
}
.cover{
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(255,50,0,.4);
}
.cover img{width:100%;}

/* TEXT */
.title{
  font-size:28px;
  font-weight:800;
  margin-top:15px;
}
.artist{
  color:#aaa;
}

/* LIVE */
.live{
  margin-top:10px;
  color:#66f5b5;
  font-size:16px;
}

/* MAIN NUMBER */
.total{
  text-align:center;
  margin:25px 0;
}
.total h1{
  font-size:55px;
  margin:0;
  color:#ff4b22;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  margin-bottom:25px;
}
.stat{
  text-align:center;
}
.stat strong{
  color:#ff6a2a;
  font-size:22px;
}
.stat span{
  display:block;
  font-size:13px;
  color:#777;
}

/* BUTTONS */
.btn{
  display:flex;
  justify-content:space-between;
  padding:18px;
  border-radius:14px;
  margin-top:15px;
  text-decoration:none;
  font-weight:800;
}

/* SPOTIFY FIRST */
.spotify{
  border:1.5px solid #1DB954;
  color:#1DB954;
}
.apple{
  background:linear-gradient(135deg,#ff003c,#ff6a00);
  color:white;
}

/* PRESSURE */
.pressure{
  text-align:center;
  margin-top:20px;
  color:#ff6a2a;
}

.brand{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#555;
}
</style>
</head>

<body>

<div class="container">

  <!-- COVER -->
  <div class="cover">
    <img src="https://raw.githubusercontent.com/omk-store/omotaker/refs/heads/main/IMG_0934.jpeg">
  </div>

  <!-- TITLE -->
  <div class="title">Badt Guy</div>
  <div class="artist">Omo Taker 🐺</div>

  <!-- LIVE -->
  <div class="live">
    👀 <span id="liveCount">156</span> people listening now
  </div>

  <!-- MAIN STAT -->
  <div class="total">
    <h1 id="total">19,000+</h1>
  </div>

  <!-- ONLY REAL STATS -->
  <div class="stats">
    <div class="stat">
      <strong>12K+</strong>
      <span>Listeners</span>
    </div>

    <div class="stat">
      <strong>10K+</strong>
      <span>Shazams</span>
    </div>
  </div>

  <!-- BUTTONS (SPOTIFY FIRST FOR VIRAL FLOW) -->
  <a href="https://open.spotify.com/track/78ckyu0HPy4oOQPzee5rkx?si=tFaTY_AXTPGJ12laDn6cGw" class="btn spotify">
    <span>Spotify</span>
    <span>LISTEN ▶</span>
  </a>

  <a href="https://music.apple.com/ng/album/badt-guy/1758752613?i=1758752614" class="btn apple">
    <span>Apple Music</span>
    <span>PLAY ▶</span>
  </a>

  <!-- PRESSURE -->
  <div class="pressure">
    🔥 19K+ plays… people are tapping in right now.
  </div>

  <div class="brand">OMK Records 🐺</div>

</div>

<script>
let live = 156;

function updateLive(){
  // NEVER DROP TO 0
  let change = Math.floor(Math.random()*30)-15;
  live += change;

  if(live < 120) live = 140;
  if(live > 300) live = 200;

  document.getElementById("liveCount").innerText = live;
}

setInterval(updateLive, 2000);
</script>

</body>
</html>
